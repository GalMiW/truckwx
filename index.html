<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TruckWX">
<meta name="theme-color" content="#0f172a">
<title>TruckWX — погода на маршруте</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230f172a'/%3E%3Cpath d='M30 110h80V70h25l20 22v18h-5a14 14 0 0 1-28 0H72a14 14 0 0 1-28 0H30z' fill='%2338bdf8'/%3E%3Cg stroke='%23fff' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M60 30v30M45 38l30 14M45 52l30-14'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#0284c7; --accent-text:#fff;
  --l0:#16a34a; --l1:#eab308; --l2:#f97316; --l3:#dc2626; --lna:#94a3b8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1220; --card:#131c2e; --text:#e2e8f0; --muted:#94a3b8; --line:#23304a; --accent:#38bdf8; --accent-text:#0b1220; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:1000;background:#0f172a;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header small{color:#94a3b8;font-weight:400}
.iconbtn{background:transparent;border:1px solid #334155;color:#fff;border-radius:10px;padding:6px 10px;font-size:15px}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 24px);max-width:900px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1}
.btn{display:inline-block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font-size:16px;font-weight:600;margin-top:12px}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent);font-weight:500}
.btn:disabled{opacity:.5}
.small{font-size:12px;color:var(--muted)}
#status{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
#map{height:46vh;min-height:280px;border-radius:14px;margin-bottom:12px;border:1px solid var(--line)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.dep{flex:0 0 auto;min-width:78px;border-radius:12px;padding:8px 8px 6px;text-align:center;border:2px solid transparent;scroll-snap-align:start;color:#fff;font-size:12px}
.dep b{display:block;font-size:15px}
.dep.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--card) inset}
.dep .p{opacity:.95}
.lv0{background:var(--l0)} .lv1{background:var(--l1);color:#1f1300} .lv2{background:var(--l2)} .lv3{background:var(--l3)} .lvna{background:var(--lna)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.badge.lv1{color:#1f1300}
.summary{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.big{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.alert{border-left:4px solid var(--l2);padding:8px 10px;margin:8px 0;background:var(--bg);border-radius:8px}
.alert.sev{border-color:var(--l3)}
.alert b{display:block}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:4px}
.links a{display:inline-block;margin:4px 6px 4px 0;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--accent);text-decoration:none;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.langrow{display:flex;gap:8px}.langrow .btn{margin-top:6px;padding:11px 6px;font-size:15px}
@media (max-width:420px){ header h1 small:not(.ver){display:none} }
.alt{display:flex;width:100%;text-align:left;gap:10px;align-items:stretch;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:10px;margin-top:8px;color:var(--text);font-size:14px}
.alt.sel{border-color:var(--accent);background:var(--card)}
.alt .bar{flex:0 0 6px;border-radius:4px}
.alt .body{flex:1;min-width:0}
.alt .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.alt .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt .time{font-size:20px;font-weight:700;white-space:nowrap}
.alt .sub{color:var(--muted);font-size:12px;margin-top:2px}
.alt .tags{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--text)}
.tag.good{background:#dcfce7;color:#14532d}.tag.toll{background:#fef3c7;color:#78350f}
@media (prefers-color-scheme: dark){ .tag.good{background:#14532d;color:#dcfce7}.tag.toll{background:#422006;color:#fde68a} }
.rlabel{background:#fff;border:2px solid;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-weight:800;font-size:14px;color:#0f172a}
/* планшет и широкий экран: карта слева на всю высоту, панели справа */
@media (min-width: 880px){
  main{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:0 16px;align-items:start}
  main > *{grid-column:2}
  #map{grid-column:1;grid-row:1 / span 40;position:sticky;top:76px;height:calc(100vh - 96px);margin-bottom:0}
  .card{margin-bottom:12px}
}
@media (min-width: 1300px){ main{grid-template-columns:minmax(0,1fr) 520px} }
.stormhead{display:flex;align-items:center;gap:10px}
.switch{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:14px;white-space:nowrap}
.switch input{width:20px;height:20px}
.playbtn{flex:0 0 auto !important;color:var(--accent) !important;border-color:var(--line) !important;min-width:48px;font-size:18px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);height:32px}
.stormtime{margin-top:4px;font-size:15px}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.stormlbl{background:rgba(15,23,42,.85);color:#fff;border-radius:6px;padding:1px 5px;font-size:11px;white-space:nowrap}
.truckico{font-size:24px;line-height:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#map{touch-action:manipulation}
.mapbtns{position:absolute;right:10px;top:10px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.mapbtns button{width:44px;height:44px;border-radius:10px;border:1px solid rgba(0,0,0,.2);background:#fff;color:#0f172a;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mapbtns button.on{background:#0284c7;color:#fff}
.maphint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1000;background:rgba(15,23,42,.9);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;display:none;max-width:70%;text-align:center}
body.mapfull #map{position:fixed !important;inset:0;z-index:1900;height:100vh !important;height:100dvh !important;width:100vw;border-radius:0;margin:0;top:0 !important}
body.mapfull{overflow:hidden}
body.mapfull .mapbtns{top:calc(env(safe-area-inset-top) + 10px)}
.pl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .ic{font-size:22px;width:28px;text-align:center}
.pl .tx{flex:1;min-width:0;font-size:14px;color:var(--text)}
.pl .tx small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl button{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:8px;padding:7px 8px;font-size:13px}
.plico{font-size:22px;line-height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.ppbtns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ppbtns button{border:1px solid #cbd5e1;background:#f1f5f9;border-radius:8px;padding:6px 8px;font-size:13px}
.optdep{font-size:15px}.optdep b{font-size:22px;display:block;margin:2px 0}
.depseg{display:flex;gap:8px}
.depseg button{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px}
.depseg button b{display:block;font-size:15px;margin-bottom:3px}
.depseg button span{display:block;color:var(--muted);line-height:1.35}
.depseg button.on{border-color:var(--accent);background:var(--card)}
.depseg button.on b{color:var(--accent)}
input[type=datetime-local]{min-height:46px}
.apok{color:#15803d;font-weight:600}.aplate{color:#b91c1c;font-weight:600}
@media (prefers-color-scheme: dark){ .apok{color:#4ade80}.aplate{color:#f87171} }
.tag.late{background:#fee2e2;color:#7f1d1d}
@media (prefers-color-scheme: dark){ .tag.late{background:#7f1d1d;color:#fee2e2} }
.acwrap input{padding-right:44px}
.clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:17px;display:none}
.acwrap.has .clr{display:block}
.revlinks{display:none;gap:8px;flex-wrap:wrap;margin-top:6px}
.revlinks.show{display:flex}
.revlinks a{font-size:13px;color:var(--accent);text-decoration:none;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.ppbtns a{border:1px solid #cbd5e1;background:#f1f5f9;border-radius:8px;padding:6px 8px;font-size:13px;text-decoration:none;color:#0369a1}
.pl a.lnk{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:8px;padding:7px 8px;font-size:13px;text-decoration:none}
.zones{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.zchip{border:0;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;color:#fff}
.zchip.lv1{color:#1f1300}
.zchip.sel{outline:3px solid var(--text);outline-offset:1px}
.zinfo{margin-top:10px;border-radius:12px;padding:12px;background:var(--bg);border-left:6px solid var(--l1)}
.zinfo.l2{border-left-color:var(--l2)} .zinfo.l3{border-left-color:var(--l3)}
.zinfo h3{margin:0 0 4px;font-size:15px}
.zinfo .kv{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:13px}
.zinfo .kv b{font-size:15px}
.zinfo .adv{font-size:14px;margin-top:6px}
.dalert{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:2600;background:#b45309;color:#fff;border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;font-size:16px}
.dalert.l1{background:#ca8a04} .dalert.l3{background:#b91c1c}
.dalert .dbtns{display:flex;gap:8px;margin-top:10px}
.dalert button{flex:1;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:700;background:rgba(255,255,255,.92);color:#0f172a}
.dbar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:2550;background:#0f172a;color:#fff;border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.dbar span{flex:1}
.dbar button{border:0;border-radius:8px;background:#dc2626;color:#fff;font-size:16px;padding:8px 12px}
body.driving main{padding-bottom:80px}
.brico.xsel{background:#16a34a;border-radius:50%;padding:3px;box-shadow:0 0 0 3px #fff}
.brico{font-size:24px;line-height:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.ver{opacity:.6;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2500;display:none;padding:0 16px}
body.lenmet .len-imp{display:none !important} body:not(.lenmet) .len-met{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:11px 6px;border:0;background:var(--bg);color:var(--text);font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:600}
#settings{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 12px 40px}
#settings .card{max-width:560px;margin:0 auto}
.hidden{display:none}
.warnbox{background:#fef3c7;color:#78350f;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
@media (prefers-color-scheme: dark){ .warnbox{background:#422006;color:#fde68a} }
.leaflet-popup-content{font-size:13px}
.acwrap{position:relative;flex:1}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:1500;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
.ac.open{display:block}
.ac button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;color:var(--text);font-size:15px}
.ac button:last-child{border-bottom:0}
.ac button small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.ac button.me{color:var(--accent);font-weight:600}
.ac .hint{padding:10px 12px;font-size:13px;color:var(--muted)}
.geobtn{flex:0 0 auto !important;color:var(--accent) !important;border-color:var(--line) !important;padding:11px 10px !important;white-space:nowrap}
.eta{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.eta .big{display:block}
.eta ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.dep .a{display:block;font-size:11px;opacity:.95;margin-top:2px}
tr.ev td{background:var(--bg);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>TruckWX <small data-i18n="sub"></small> <small class="ver">v3.7</small></h1>
  <button class="iconbtn" id="btnLang" aria-label="Language">RU</button>
  <button class="iconbtn" id="btnUnits" aria-label="Units">mi</button>
  <button class="iconbtn" id="btnSettings" data-i18n-title="set.h">&#9881;</button>
</header>

<main>
  <div class="card">
    <label for="from" data-i18n="from"></label>
    <div class="row">
      <div class="acwrap"><input id="from" data-i18n-ph="ph.addr" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next"><button type="button" class="clr" data-for="from" aria-label="clear">✕</button><div class="ac" id="acFrom"></div></div>
      <button class="iconbtn geobtn" id="btnGeo" data-i18n="geo.btn"></button>
    </div>
    <label for="to" data-i18n="to"></label>
    <div class="acwrap"><input id="to" data-i18n-ph="ph.addr" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><button type="button" class="clr" data-for="to" aria-label="clear">✕</button><div class="ac" id="acTo"></div></div>
    <div class="revlinks" id="toLinks">
      <a id="toReviews" target="_blank" rel="noopener"></a>
      <a id="toStreet" target="_blank" rel="noopener"></a>
    </div>
    <label for="appt" data-i18n="ap.label"></label>
    <div class="row" style="align-items:stretch">
      <input type="datetime-local" id="appt" step="600" style="flex:1">
      <button class="iconbtn geobtn" id="apptClr" style="min-width:48px">✕</button>
    </div>
    <label for="xing" data-i18n="xg.label"></label>
    <select id="xing"></select>
    <button class="btn" id="btnGo" data-i18n="go"></button>
    <div id="status"></div>
    <div id="routeWarn" class="warnbox hidden"></div>
  </div>

  <div id="map"></div>

  <div class="card hidden" id="cardStorm">
    <div class="stormhead">
      <h2 data-i18n="storm.h" style="margin:0;flex:1"></h2>
      <label class="switch"><input type="checkbox" id="stormOn" checked> <span data-i18n="storm.show"></span></label>
    </div>
    <div id="stormBody">
      <div class="row" style="align-items:center;margin-top:10px">
        <button class="iconbtn playbtn" id="stormPlay">▶</button>
        <input type="range" id="stormT" min="0" max="48" step="1" value="0" style="flex:1">
      </div>
      <div class="stormtime"><b id="stormTime">—</b> <span id="stormRel" class="small"></span></div>
      <div class="legend" style="margin-top:4px">
        <span><span class="sq" style="background:#93c5fd"></span><span data-i18n="storm.light"></span></span>
        <span><span class="sq" style="background:#3b82f6"></span><span data-i18n="storm.mod"></span></span>
        <span><span class="sq" style="background:#a21caf"></span><span data-i18n="storm.core"></span></span>
        <span><span class="sq" style="background:#ec4899"></span><span data-i18n="storm.ice"></span></span>
        <span><span class="sq" style="background:#86efac"></span><span data-i18n="storm.rain"></span></span>
        <span>🚚 <span data-i18n="storm.truckL"></span></span>
      </div>
      <div id="stormInfo" class="small" style="margin-top:8px"></div>
    </div>
  </div>

  <div class="card hidden" id="cardDeps">
    <h2 data-i18n="deps.h"></h2>
    <div class="optdep" id="optDep"></div>
    <div id="depTip" class="small" style="margin-top:8px"></div>
    <div id="nowLine" class="small" style="margin-top:4px"></div>
  </div>

  <div class="card" id="cardRuns">
    <div class="stormhead">
      <h2 data-i18n="rn.h" style="margin:0;flex:1"></h2>
      <button class="iconbtn geobtn" id="rnSaveBtn" data-i18n="rn.save"></button>
    </div>
    <div id="rnList" class="small" style="margin-top:6px"></div>
  </div>

  <div class="card" id="cardPlaces">
    <div class="stormhead">
      <h2 data-i18n="pl.h" style="margin:0;flex:1"></h2>
      <button class="iconbtn geobtn" id="plAdd" data-i18n="pl.add"></button>
    </div>
    <div id="plList" class="small" style="margin-top:6px"></div>
  </div>

  <div class="card hidden" id="cardAlts">
    <h2 data-i18n="alts.h"></h2>
    <div id="altsFor" class="small"></div>
    <div id="alts"></div>
    <div id="altsRec" class="small" style="margin-top:6px"></div>
  </div>


    <div id="bestTip" class="small" style="margin-top:6px"></div>
  </div>

  <div class="card hidden" id="cardTrip">
    <h2><span data-i18n="trip.dep"></span> <span id="tripDep"></span></h2>
    <div class="summary">
      <span id="tripBadge" class="badge"></span>
      <span id="tripText"></span>
    </div>
    <div class="eta" id="eta"></div>
    <button class="btn" id="btnDrive"></button>
    <div id="lakeNote" class="warnbox hidden" style="margin-top:10px"></div>
    <div id="zonesH" class="small" style="margin-top:12px"></div>
    <div id="zones" class="zones"></div>
    <div id="zoneInfo" class="zinfo hidden"></div>
    <details id="evBox" class="hidden" style="margin-top:8px"><summary id="evSum"></summary><div id="evList" class="small"></div></details>
  </div>

  <div class="card hidden" id="cardAlerts">
    <h2 data-i18n="alerts.h"></h2>
    <div id="alerts" class="small">—</div>
  </div>

  <div class="card hidden" id="cardBridges">
    <h2 data-i18n="bridges.h"></h2>
    <div id="bridges" class="small">—</div>
  </div>

const LANGS = [["ru","RU","Русский"],["uk","UA","Українська"],["en","EN","English"]];
function detectLang(){ const l = (navigator.language||"en").toLowerCase(); return l.startsWith("uk") ? "uk" : l.startsWith("ru") ? "ru" : "en"; }
function t(k, vars){
  const L = I18N[(typeof S!=="undefined" && S.lang) || detectLang()] || I18N.en;
  let s = (k in L) ? L[k] : (k in I18N.en ? I18N.en[k] : k);
  if(vars && typeof s === "string") s = s.replace(/\{(\w+)\}/g, (m, n) => (n in vars) ? vars[n] : m);
  return s;
}
const whyTxt = arr => arr.map(k => k==="w.vis400" ? t(k, {v: IMP() ? "¼ mi" : "400 "+t("m")}) : k==="w.restr" ? t(k, {spd: U.spd(Number(S.rmph)||45)}) : t(k)).join(", ");
function applyStatic(){
  document.documentElement.lang = S.lang || detectLang();
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-title]").forEach(e => { e.title = t(e.dataset.i18nTitle); e.setAttribute("aria-label", e.title); });
  const lb = document.getElementById("btnLang"); if(lb) lb.textContent = (LANGS.find(x=>x[0]===(S.lang||detectLang()))||LANGS[2])[1];
}

async function getJSON(url, opts={}, timeoutMs=25000){

async function pool(items, n, fn){
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => {
    while(i < items.length){ const k = i++; try{ out[k] = await fn(items[k], k); }catch(e){ out[k] = null; } }
  }));
  return out;
}
function hav(a, b){ // [lat,lon] -> km
  const R=6371, r=Math.PI/180, dLa=(b[0]-a[0])*r, dLo=(b[1]-a[1])*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

let XWX = null;
async function loadXingWx(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${XINGS.map(x=>x.lat).join(",")}&longitude=${XINGS.map(x=>x.lon).join(",")}`+
      `&hourly=temperature_2m,precipitation,snowfall,precipitation_probability,weather_code,wind_gusts_10m,visibility&forecast_days=4&timeformat=unixtime&timezone=GMT&wind_speed_unit=kmh`;
    let j = await getJSON(url, {}, 30000); j = Array.isArray(j) ? j : [j];
    XWX = {}; XINGS.forEach((x, i) => XWX[x.id] = j[i]);
    fillXingSelect();
  }catch(e){ XWX = null; }
}
function xingRisk(x, fromSec, hours){ // опасные окна (жёлтый+ / оранжевый+) на ближайшие часы
  const loc = XWX && XWX[x.id]; if(!loc) return null;
  const wins = []; let cur = null, maxL = 0;
  for(let h=0; h<=hours; h++){
    const ts = fromSec + h*3600, a = assess(valAt(loc, ts), null);
    if(a.lvl > maxL) maxL = a.lvl;
    if(a.lvl >= 2){ if(!cur){ cur = {a:ts, b:ts, why:new Set(a.why), lvl:a.lvl}; wins.push(cur); } cur.b = ts; cur.lvl = Math.max(cur.lvl, a.lvl); a.why.forEach(w => cur.why.add(w)); }
    else cur = null;
  }
  return {maxL, wins};
}
function xingWxHtml(x){
  const loc = XWX && XWX[x.id]; if(!loc) return "";
  const now = Date.now()/1000, v = valAt(loc, now), a = assess(v, null);
  let h = `<br><b>${t("xg.now")}:</b> ${U.temp(v && v.temp)}, ${v && v.snow>0 ? t("th.snow").toLowerCase()+" "+U.snow(v.snow)+t("perh") : t("xg.nosnow")} — ${lvName(Math.max(0,a.lvl))}`;
  // когда вы будете на переходе (если маршрут через него)
  if(STATE && STATE.deps && STATE.route && STATE.route.xing && STATE.route.xing.id === x.id){
    const R = STATE.deps[STATE.sel||0].rows; let best = null, bd = 1e9;
    R.forEach(r => { const d = hav([r.p.lat,r.p.lon],[x.lat,x.lon]); if(d < bd){ bd = d; best = r; } });
    if(best){ const va = valAt(loc, best.t/1000), aa = assess(va, null);
      h += `<br><b>${t("xg.youHere",{t:fmtT(best.t)})}:</b> ${U.temp(va && va.temp)}, ${lvName(Math.max(0,aa.lvl))}${aa.why.length && aa.lvl>0 ? " — "+esc(whyTxt(aa.why)) : ""}`; }
  }
  const rk = xingRisk(x, now, 48);
  if(rk) h += "<br>" + (rk.wins.length ? "⚠ " + rk.wins.slice(0,2).map(w => `${fmtT(w.a*1000)}–${fmtT((w.b+3600)*1000)}: ${esc(whyTxt([...w.why]))}`).join("; ") : t("xg.calm48"));
  return h;
}

/* ============ геокодирование ============ */
async function geocodeInput(el){

/* штаты и провинции: «York PA», «York, pa», «Saint John NB» */
const STATES = {AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",DC:"District of Columbia",FL:"Florida",GA:"Georgia",
  HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",
  MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",
  OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",
  WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",
  NB:"New Brunswick",NS:"Nova Scotia",PE:"Prince Edward Island",PEI:"Prince Edward Island",NL:"Newfoundland and Labrador",QC:"Quebec",PQ:"Quebec",ON:"Ontario",MB:"Manitoba",
  SK:"Saskatchewan",AB:"Alberta",BC:"British Columbia"};
const STATE_CODE = Object.fromEntries(Object.entries(STATES).map(([k,v]) => [v.toLowerCase(), k]));
function splitState(q){ // "York pa" -> {base:"York", st:"Pennsylvania"}
  const m = q.trim().match(/^(.+?)[\s,]+([A-Za-z]{2,3})\.?$/);
  if(m){ const code = m[2].toUpperCase(); if(STATES[code] && m[1].trim().length >= 2) return {base:m[1].replace(/,\s*$/,"").trim(), st:STATES[code]}; }
  const lo = q.toLowerCase();
  for(const full in STATE_CODE){ if(lo.endsWith(" "+full) || lo.endsWith(","+full)){ const base = q.slice(0, q.length-full.length).replace(/[\s,]+$/,""); if(base.length>=2) return {base, st:STATES[STATE_CODE[full]]}; } }
  return {base:q.trim(), st:null};
}
const PLACE_RANK = {city:0, town:0, village:1, hamlet:2, district:3, locality:3};
async function photonSearch(q, opt={}){
  const {base, st} = splitState(q), bias = opt.bias || {lat:44.5, lon:-68.5};
  const go = async text => {
    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(text)}&limit=${opt.limit||7}&lang=en&lat=${bias.lat}&lon=${bias.lon}&bbox=-100,24,-50,62`;
    const r = await fetch(url, {signal:opt.signal}); const j = await r.json(); return j.features || [];
  };
  let feats = await go(st ? base+" "+st : q);
  if(!feats.length){ const c = cleanAddr(q); if(c && c!==q){ const s2 = splitState(c); feats = await go(s2.st ? s2.base+" "+s2.st : c); } }
  if(st){
    const ok = f => (f.properties.state||"").toLowerCase() === st.toLowerCase();
    if(!feats.some(ok)){ const more = await go(base).catch(()=>[]); feats = feats.concat(more); }
    feats.sort((a,b) => (ok(b)?1:0)-(ok(a)?1:0) || (PLACE_RANK[a.properties.type] ?? 5)-(PLACE_RANK[b.properties.type] ?? 5));
    const good = feats.filter(ok); if(good.length) feats = good.concat(feats.filter(f=>!ok(f)).slice(0,2));
  }
  return feats;
}
function cleanAddr(q){ // убираем индексы и страну — поиску так проще
  return q.replace(/\b[A-Za-z]\d[A-Za-z]\s?\d[A-Za-z]\d\b/g, "").replace(/\b\d{5}(-\d{4})?\b/g, "")
          .replace(/,?\s*(United States( of America)?|USA|Canada)\s*$/i, "").replace(/\s*,\s*,/g, ",").replace(/[\s,]+$/, "").trim();
}
async function geocode(q0){
  const tries = [q0.trim()], c = cleanAddr(q0);
  if(c && c !== tries[0]) tries.push(c);
  const noNum = c.replace(/^\d+[A-Za-z]?\s+/, ""); if(noNum !== c) tries.push(noNum);
  const parts = c.split(","); if(parts.length >= 3) tries.push(parts.slice(1).join(",").trim());
  let err;
  for(const q of tries){ try{ return await geocode1(q); }catch(e){ err = e; } }
  throw err;
}
async function geocode1(q){
  q = q.trim();
  const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m) return {name:q, lat:+m[1], lon:+m[2]};
  const p = PRESETS.find(x => x[0].toLowerCase() === q.toLowerCase());
  if(p) return {name:p[0], lat:p[1], lon:p[2]};
  try{
    const f = (await photonSearch(q, {limit:5}))[0];
    if(f){ const pr=f.properties; return {name:[pr.name, pr.city, pr.state].filter(Boolean).join(", "), lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0]}; }
  }catch(e){}
  const sp = splitState(q);
  const j2 = await getJSON("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca,us&q="+encodeURIComponent(sp.st ? sp.base+", "+sp.st : q));
  if(j2 && j2[0]) return {name:j2[0].display_name.split(",").slice(0,3).join(","), lat:+j2[0].lat, lon:+j2[0].lon};
  throw new Error(t("err.addr")+" "+q);
}
async function revName(lat, lon){
  const j = await getJSON(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&lang=en`, {}, 10000);
  const pr = j.features && j.features[0] && j.features[0].properties;
  if(!pr) return null;
  return {place: pr.city || pr.town || pr.village || pr.county || pr.name || "", state: pr.state || "", cc: (pr.countrycode||"").toUpperCase()};
}

/* ============ маршрут ============ */
function roadSummary(pairs){ // [[name, meters]] -> "I-95 · ME-9"
  const m = new Map();
  pairs.forEach(([n, d]) => { if(!n || n==="-") return; n = String(n).split(/[;,]/)[0].trim().replace(/^I (\d)/,"I-$1").replace(/^(US|ME|NB|NS|NH|MA|NY|NJ|CT|RI|VT|QC|PA) (\d)/,"$1-$2");
    if(n) m.set(n, (m.get(n)||0) + d); });
  return [...m.entries()].sort((x,y)=>y[1]-x[1]).slice(0,2).map(x=>x[0]).join(" · ");
}
async function routeORS(a, b, via){
  const h = heightM(), pts = [a].concat(via||[], [b]);
  const opt = {vehicle_type:"hgv", profile_params:{restrictions:{height:+h.toFixed(2), width:2.6, length:Number(S.l)||22, weight:Number(S.w)||36}}};
  if(S.tolls==="avoid") opt.avoid_features = ["tollways"];
  const body = {coordinates: pts.map(p=>[p.lon,p.lat]), radiuses: pts.map(()=>-1), instructions:true, extra_info:["tollways","waycategory"], options:opt};
  const j = await getJSON("https://api.openrouteservice.org/v2/directions/driving-hgv/geojson",
    {method:"POST", headers:{"Authorization":S.key, "Content-Type":"application/json"}, body:JSON.stringify(body)}, 40000);
  const f = j.features[0], pr = f.properties;
  let snapKm = 0;
  if(via && via.length && pr.way_points && pr.way_points.length > 2){ const sc = f.geometry.coordinates[pr.way_points[1]]; if(sc) snapKm = hav([sc[1],sc[0]], [via[0].lat, via[0].lon]); }
  const steps = (pr.segments||[]).flatMap(sg => sg.steps||[]);
  const tollV = pr.extras && pr.extras.tollways ? pr.extras.tollways.values : [];
  // доля пути по автомагистралям (waycategory: бит 1 = highway)
  const gc = f.geometry.coordinates, wc = pr.extras && pr.extras.waycategory ? pr.extras.waycategory.values : null;
  let hw = null;
  if(wc){ let tot = 0, on = 0; wc.forEach(([i0, i1, v]) => { let d = 0; for(let i=i0;i<i1 && i+1<gc.length;i++) d += hav([gc[i][1],gc[i][0]],[gc[i+1][1],gc[i+1][0]]); tot += d; if(v & 1) on += d; }); hw = tot ? on/tot : null; }
  return {coords:gc.map(c=>[c[1],c[0]]), dist:pr.summary.distance, dur:pr.summary.duration, truck:true, via:!!(via&&via.length), snapKm, hw,
    roads: roadSummary(steps.map(st=>[st.name, st.distance])), toll: tollV.some(v => v[2]>0)};
}
function osrmParse(r){
  const steps = (r.legs||[]).flatMap(l => l.steps||[]);
  const toll = steps.some(st => (st.intersections||[]).some(x => (x.classes||[]).includes("toll")));
  const roads = steps.length ? roadSummary(steps.map(st=>[st.ref || st.name, st.distance])) : (r.legs||[]).map(l=>l.summary).filter(Boolean).join(" · ");
  let tot = 0, on = 0;
  steps.forEach(st => { const d = st.distance||0; tot += d; if((st.intersections||[]).some(x => (x.classes||[]).includes("motorway")) || /^(I|A|TCH)[ -]?\d/.test(st.ref||"")) on += d; });
  return {coords:r.geometry.coordinates.map(c=>[c[1],c[0]]), dist:r.distance, dur:r.duration, truck:false, roads, toll, hw: tot ? on/tot : null};
}
async function routeOSRM(a, b, via, alts){
  const pts = [a].concat(via||[], [b]).map(p=>p.lon+","+p.lat).join(";");
  const ex = S.tolls==="avoid" ? "&exclude=toll" : "";
  let j;
  try{ j = await getJSON(`https://router.project-osrm.org/route/v1/driving/${pts}?overview=full&geometries=geojson&steps=true${alts?"&alternatives=3":""}${ex}`, {}, 30000); }
  catch(e){ if(!ex) throw e; j = await getJSON(`https://router.project-osrm.org/route/v1/driving/${pts}?overview=full&geometries=geojson&steps=true${alts?"&alternatives=3":""}`, {}, 30000); }
  const snapKm = via && via.length && j.waypoints && j.waypoints[1] ? (j.waypoints[1].distance||0)/1000 : 0;
  return (j.routes||[]).map(r => Object.assign(osrmParse(r), {via:!!(via&&via.length), snapKm}));
}
function viaPoints(a, b){ // точки в стороне от прямой — чтобы найти объезды (по две на каждую сторону)
  const dk = hav([a.lat,a.lon],[b.lat,b.lon]); if(dk < 60) return [];
  const mLat = (a.lat+b.lat)/2, mLon = (a.lon+b.lon)/2, k = Math.cos(mLat*Math.PI/180);
  const dx = (b.lon-a.lon)*k, dy = (b.lat-a.lat), len = Math.hypot(dx, dy), out = [];
  [0.12, 0.22].forEach(fr => { const off = Math.min(fr*len, 2.2);
    [1,-1].forEach(sgn => out.push({lat: mLat + sgn*(dx/len)*off, lon: mLon - sgn*(dy/len)*off/k})); });
  return out;
}
function hasSpur(route){ // маршрут заезжает куда-то и возвращается той же дорогой (например, на полуостров)
  const c = route.coords, S2 = []; let acc = 0, last = null;
  for(let i=0;i<c.length;i++){ if(last){ acc += hav(last, c[i]); } if(!S2.length || acc - S2[S2.length-1].km >= 3) S2.push({p:c[i], km:acc}); last = c[i]; }
  for(let i=0;i<S2.length;i++){
    for(let j=i+1;j<S2.length;j++){
      if(S2[j].km - S2[i].km < 30) continue;
      const a = S2[i].p, b = S2[j].p;
      if(Math.abs(a[0]-b[0]) < 0.02 && Math.abs(a[1]-b[1]) < 0.03 && hav(a,b) < 2) return true;
    }

function overlap(r1, r2){ // доля точек r1, лежащих рядом с r2

  let near = 0;
  for(const p of s1){ for(const q of s2){ if(Math.abs(p[0]-q[0])<0.05 && Math.abs(p[1]-q[1])<0.07 && hav(p,q)<3){ near++; break; } } }
  return near/s1.length;
}
// Узлы автомагистралей на северо-востоке США и в Атлантической Канаде — через них ищем объезды ПО ТРАССАМ
const HUBS = [
  ["Houlton I-95",46.13,-67.84,1],["Bangor I-95/I-395",44.83,-68.77],["Augusta I-95",44.33,-69.78],["Portland I-95/I-295",43.70,-70.31],
  ["Portsmouth I-95",43.07,-70.79],["Concord I-93/I-89",43.21,-71.54],["White River Jct I-91/I-89",43.65,-72.32],
  ["Worcester I-290/I-495",42.30,-71.73],["Sturbridge I-84/I-90",42.10,-72.08],["Springfield I-91/I-90",42.11,-72.59],
  ["Hartford I-84/I-91",41.77,-72.68],["Providence I-95",41.82,-71.41],["New Haven I-95/I-91",41.31,-72.92],
  ["Danbury I-84",41.40,-73.46],["Newburgh I-84/I-87",41.52,-74.07],["Albany I-87/I-90",42.70,-73.80],["Scranton I-81/I-84",41.40,-75.66],
  ["Montreal A-20/A-10",45.50,-73.60],["Rivière-du-Loup A-20/A-85",47.83,-69.53],["Edmundston TCH-2",47.37,-68.33],
  ["Fredericton TCH-2",45.95,-66.64],["Saint John NB-1",45.29,-66.06],["Truro NS-102/104",45.37,-63.27],["Amherst TCH-104",45.83,-64.20]

function hubVias(a, b){
  const D = hav([a.lat,a.lon],[b.lat,b.lon]); if(D < 120) return [];
  // gate = пограничный переход на интерстейт (Houlton, I-95) — пробуем всегда, если он не слишком в стороне
  return HUBS.map(h => { const d1 = hav([a.lat,a.lon],[h[1],h[2]]), d2 = hav([h[1],h[2]],[b.lat,b.lon]); return {name:h[0], lat:h[1], lon:h[2], r:(d1+d2)/D, d1, d2, gate:!!h[3]}; })
    .filter(h => h.d1 > 60 && h.d2 > 60 && (h.r <= 1.25 || (h.gate && h.r <= 1.4)))
    .sort((x,y) => (y.gate?1:0)-(x.gate?1:0) || x.r - y.r).slice(0, 8);
}
async function getRoutes(a, b){
  const cands = [], X = xingById($("xing").value);
  const R1 = v => S.key ? routeORS(a, b, v).then(r=>[r]).catch(()=>routeOSRM(a, b, v).catch(()=>[])) : routeOSRM(a, b, v).catch(()=>[]);
  if(X && inCanada(a.lat,a.lon) !== inCanada(b.lat,b.lon)){
    // выбран погранпереход: все варианты — через него
    if(!S.key) warn(t("w.nokey"));
    status(t("st.alts"));
    const jobs = [R1([X])];
    hubVias({lat:X.lat, lon:X.lon}, b).slice(0,5).forEach(h => jobs.push(R1([X, h])));
    hubVias(a, {lat:X.lat, lon:X.lon}).slice(0,2).forEach(h => jobs.push(R1([h, X])));
    (await Promise.all(jobs)).forEach(list => list.forEach(r => { r.via = true; r.forced = true; cands.push(r); }));
    if(!cands.length) throw new Error("route");
    cands.forEach(r => r.xing = detectXing(r));
    const ok = cands.filter(r => !hasSpur(r)), pool = (ok.length ? ok : cands);
    const cost = r => r.dur * (1 + 2.5*(1 - (r.hw == null ? 0.8 : r.hw)));
    const byCost = pool.slice().sort((x,y) => cost(x) - cost(y)), main = byCost[0], out = [main];
    byCost.slice(1).forEach(r => { if(out.length<3 && r.dur <= main.dur*1.3 && !out.some(o => overlap(r,o) > 0.8)) out.push(r); });
    return out;
  }
  if(S.key){
    try{ cands.push(await routeORS(a, b)); }
    catch(e){ warn(t("w.orsfail",{e:e.message})); }
  } else warn(t("w.nokey"));
  status(t("st.alts"));
  const jobs = [];
  if(!cands.length || !S.key) jobs.push(routeOSRM(a, b, null, true).catch(()=>[]));
  let vias = hubVias(a, b); if(vias.length < 2) vias = vias.concat(viaPoints(a, b));
  vias.forEach(v => jobs.push(R1([v])));
  // через границу: пробуем разные стандартные переходы — зимой погода на них очень разная (озёрный снег у Buffalo, Tug Hill и т.д.)
  if(inCanada(a.lat,a.lon) !== inCanada(b.lat,b.lon)){
    const D = hav([a.lat,a.lon],[b.lat,b.lon]);
    XINGS.filter(x => x.std).map(x => ({x, r:(hav([a.lat,a.lon],[x.lat,x.lon]) + hav([x.lat,x.lon],[b.lat,b.lon]))/D}))
      .filter(o => o.r <= 1.35).sort((p,q) => p.r - q.r).slice(0,4)
      .forEach(o => jobs.push(R1([o.x]).then(list => { list.forEach(r => r.viaX = o.x.id); return list; })));
  }
  (await Promise.all(jobs)).forEach(list => list.forEach(r => cands.push(r)));
  if(!cands.length) throw new Error("route");
  // плохие объезды: точка «в океане», заезд туда-обратно
  let pool0 = cands.filter(r => !(r.via && (r.snapKm > 15 || hasSpur(r))));
  if(!pool0.length) pool0 = cands;
  // только по автомагистралям: доля трасс не меньше 70% (если данных нет — не отбрасываем)
  const HW = 0.7, hwOK = r => r.hw == null || r.hw >= HW;
  const hwPool = pool0.filter(hwOK);
  const pool = hwPool.length ? hwPool : pool0.slice().sort((x,y)=>(y.hw||0)-(x.hw||0)).slice(0,1);
  // «цена» маршрута: время × штраф за километры НЕ по трассам (двухполосные «националки» вроде ME-9, US-1)
  pool.forEach(r => r.xing = detectXing(r));
  // авто: стандартные грузовые переходы (Houlton, Lacolle/Champlain, Thousand Islands…) в приоритете, остальные — только если заметно выгоднее
  const cost = r => r.dur * (1 + 2.5*(1 - (r.hw == null ? 0.8 : r.hw))) * (r.xing && !r.xing.std ? 1.15 : 1);
  const byCost = pool.slice().sort((x,y) => cost(x) - cost(y));
  const main = byCost[0];
  const out = [main];
  // сначала — варианты через ДРУГИЕ погранпереходы (чтобы сравнить погоду), потом — остальные объезды
  byCost.slice(1).forEach(r => {
    if(out.length>=3 || r.dur > main.dur*1.3 || !r.xing) return;
    if(out.some(o => o.xing && o.xing.id === r.xing.id)) return;
    if(out.some(o => overlap(r,o) > 0.8)) return;
    out.push(r);
  });

    if(out.length>=3 || out.includes(r) || r.dur > main.dur*1.3) return;

function samplePoints(route, target){
  const c = route.coords, cum=[0];
  for(let i=1;i<c.length;i++) cum.push(cum[i-1]+hav(c[i-1],c[i]));
  const total = cum[cum.length-1];
  const step = Math.max(25, total/(target||40));
  const pts=[]; let next=0;
  for(let i=0;i<c.length;i++){
    if(cum[i]>=next || i===c.length-1){ pts.push({lat:+c[i][0].toFixed(3), lon:+c[i][1].toFixed(3), km:cum[i], idx:i}); next = cum[i]+step; }

  const durH = route.dur/3600;
  pts.forEach(p => p.offH = durH * (p.km/total));
  return {pts, totalKm:total, durH, cum};
}

async function fetchForecast(pts){

}
async function fetchEnsemble(pts){
  const lat = pts.map(p=>p.lat).join(","), lon = pts.map(p=>p.lon).join(",");
  const url = `https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}`+
    `&hourly=snowfall&models=gfs025&forecast_days=5&timeformat=unixtime&timezone=GMT`;
  let j = await getJSON(url, {}, 45000);
  j = Array.isArray(j) ? j : [j];
  // вероятность: доля членов ансамбля с >= 2 см снега за 3 часа (t-1..t+1)
  return j.map(loc => {
    const h = loc.hourly, keys = Object.keys(h).filter(k => k.startsWith("snowfall"));
    const n = h.time.length, prob = new Array(n).fill(null);
    for(let t=0;t<n;t++){
      let hit=0, cnt=0;
      for(const k of keys){
        const a=h[k]; let s=0, ok=false;
        for(let d=-1; d<=1; d++){ const v=a[t+d]; if(v!=null){ s+=v; ok=true; } }
        if(ok){ cnt++; if(s>=2) hit++; }
      }
      prob[t] = cnt ? hit/cnt : null;
    }
    return {time:h.time, prob};
  });
}
function valAt(loc, tSec){
  const h = loc.hourly, i = Math.round((tSec - h.time[0])/3600);

          code:h.weather_code[i], gust:h.wind_gusts_10m[i], vis:h.visibility ? h.visibility[i] : null};
}
function probAt(ens, tSec){
  if(!ens) return null;
  const i = Math.round((tSec - ens.time[0])/3600);
  return (i<0 || i>=ens.prob.length) ? null : ens.prob[i];
}
function assess(v, prob){
  if(!v) return {lvl:-1, why:["w.nofc"]};
  let lvl=0; const why=[];
  const up=(l,w)=>{ if(l>lvl) lvl=l; if(w && !why.includes(w)) why.push(w); };
  const empty = isLight();
  if([56,57,66,67].includes(v.code)) up(3,"w.ice");
  if(v.snow>=3) up(3,"w.hsnow"); else if(v.snow>=1.5) up(2,"w.snowfall"); else if(v.snow>=0.3) up(1,"w.snow");
  if([75,86].includes(v.code)) up(2,"w.hsnow");
  const g = v.gust||0, g3 = empty?75:90, g2 = empty?60:70, g1 = empty?45:55;
  if(g>=g3) up(3,"w.stormwind"); else if(g>=g2) up(2,"w.sgust"); else if(g>=g1) up(1,"w.gust");
  if(v.vis!=null){ if(v.vis<400) up(2,"w.vis400"); else if(v.vis<1500) up(1,"w.lowvis"); }
  if(v.temp!=null && v.temp>-3 && v.temp<1.5 && (v.pr||0)>=0.2) up(1,"w.blackice");

  if([96,99].includes(v.code)) up(2,"w.hail"); else if(v.code>=95) up(1,"w.thunder");
  if(prob!=null){ if(prob>=0.6) up(2,"w.hiprob"); else if(prob>=0.3) up(1,"w.prob"); }
  return {lvl, why};
}

/* ============ предупреждения ============ */
function pip(pt, ring){ // pt [lon,lat], ring [[lon,lat],...]
  let ins=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if(((yi>pt[1])!==(yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) ins=!ins;
  }
  return ins;
}
function inGeom(pt, g){
  if(!g) return false;
  if(g.type==="Polygon") return pip(pt, g.coordinates[0]);
  if(g.type==="MultiPolygon") return g.coordinates.some(p => pip(pt, p[0]));
  return false;
}

async function fetchECCC(pts, bbox){

  const j = await getJSON(url, {}, 25000);

/* ============ низкие мосты (OSM) ============ */
function parseHeight(s){
  if(!s) return null; s = String(s).trim().toLowerCase();
  if(/^(none|default|below_default|no_sign|no_indications|unsigned|signed)$/.test(s)) return null;
  let m = s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft|feet|′)\s*(?:(\d+(?:\.\d+)?)\s*(?:"|in|inch|inches|″)?)?$/);
  if(m) return +m[1]*0.3048 + (m[2]? +m[2]*0.0254 : 0);
  m = s.match(/^(\d+(?:\.\d+)?)\s*m?$/);
  if(m){ const v=+m[1]; return v>=8 ? v*0.3048 : v; } // «13.5» без единиц в США — скорее футы
  return null;
}
async function fetchBridges(route){
  // прореживаем линию до точки примерно каждые 1.2 км
  const c = route.coords, line=[]; let last=null;
  for(const p of c){ if(!last || hav(last,p)>=1.2){ line.push(p); last=p; } }
  line.push(c[c.length-1]);
  const coordStr = line.map(p=>p[0].toFixed(5)+","+p[1].toFixed(5)).join(",");
  const q = `[out:json][timeout:150];(way["maxheight"](around:18,${coordStr});node["maxheight"](around:18,${coordStr});way["maxheight:physical"](around:18,${coordStr}););out center tags;`;
  const eps = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
  let j=null, err=null;
  for(const ep of eps){
    try{ j = await getJSON(ep, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"data="+encodeURIComponent(q)}, 160000); break; }
    catch(e){ err=e; }
  }
  if(!j) throw err || new Error(t("ovp"));
  const H = heightM(), out=[];
  for(const e of j.elements||[]){
    const t = e.tags||{}, raw = t["maxheight:physical"] || t.maxheight;
    const hm = parseHeight(raw); if(hm==null) continue;
    const lat = e.lat ?? (e.center && e.center.lat), lon = e.lon ?? (e.center && e.center.lon);
    if(lat==null) continue;
    const gap = hm - H;
    if(gap > 0.3) continue;
    out.push({lat, lon, hm, raw, gap, name: t.name || t.ref || null, kind: t.bridge ? "br.bridge" : t.tunnel ? "br.tunnel" : "br.limit", id:e.type+"/"+e.id});
  }
  // ближайшие дубли (одна и та же точка разными объектами)
  const ded=[]; for(const b of out.sort((a,b)=>a.gap-b.gap)){ if(!ded.some(d=>hav([d.lat,d.lon],[b.lat,b.lon])<0.15)) ded.push(b); }
  // сортируем по ходу маршрута
  ded.forEach(b => { let best=1e9, bi=0; route.coords.forEach((p,i)=>{ if(i%3) return; const d=hav(p,[b.lat,b.lon]); if(d<best){best=d;bi=i;} }); b.order=bi; });
  return ded.sort((a,b)=>a.order-b.order);
}

      if(b && b.lvl >= 3){ const open = bridgeOpenAt(t); if(open){ events.push({at:i, pos:"before", type:"bridge", from:t, until:open}); bd.storm += (open - t)/3600; t = open; b = bridgeAt(t); } }
      if(b && b.lvl >= 2){ a = {lvl:Math.max(a.lvl, b.lvl), why:a.why.concat(b.lvl>=3 ? "w.bridgeRestr" : "w.bridgeLight")}; }
    }
    rows.push({p, t:t*1000, v, pr, a});
    if(a.lvl>maxL) maxL=a.lvl; if(a.lvl>0) score += a.lvl*a.lvl;
    if(pr!=null && (maxP==null || pr>maxP)) maxP=pr;

    const segKm = pts[i+1].km - p.km; if(segKm<=0) continue;

    const rCap = cap;
    const tf = trafficFactor(p, t), spd = cap*tf.f;

    bd.wx += segKm/wxCap - segKm/v0; bd.restr += segKm/rCap - segKm/wxCap; bd.traffic += segKm/spd - segKm/rCap; bd.work += workPerKm*segKm;

    prevRestr = ps ? ps.why : null;
    if(tf.f<1 && !events.some(e=>e.type==="traffic" && e.n===tf.n)) events.push({at:i, pos:"after", type:"traffic", n:tf.n, f:tf.f, from:t});

      if(Number(S.hos)===2 && drv+segH>11){ events.push({at:i, pos:"after", type:"rest", from:t, h:10}); t+=10*3600; bd.hos+=10; drv=0; sinceBreak=0; }
      else if(sinceBreak+segH>8){ events.push({at:i, pos:"after", type:"break", from:t, h:0.5}); t+=1800; bd.hos+=0.5; sinceBreak=0; }
    }

  }

function latestDeparture(){ // последний выезд, чтобы успеть к appointment (с запасом), точность 10 мин
  const T = apptTarget(); if(!T) return null;
  const D = STATE.deps; let k = -1;
  for(let i=0; i<=72 && i<D.length; i++){ if(D[i].maxL>=0 && D[i].eta <= T) k = i; }

function optIndex(){
  // с appointment: успеть к сроку (с запасом) с минимальными задержками; при равенстве — выехать позже
  const D = STATE.deps, N = Math.min(72, D.length-1), T = apptTarget();
  if(T){
    let bi = -1, best = Infinity;
    for(let k=0; k<=N; k++){ const d = D[k]; if(d.maxL<0 || d.eta > T) continue; if(d.delayH <= best + 1/60){ if(d.delayH < best) best = d.delayH; bi = k; } }
    if(bi >= 0) return bi;
  }
  // оптимально = приехать как можно раньше (допуск 1 ч), а среди таких — с минимальными задержками в пути
  let minEta = Infinity; for(let k=0; k<=N; k++) if(D[k].maxL>=0) minEta = Math.min(minEta, D[k].eta);
  let bi = 0, best = Infinity;
  for(let k=0; k<=N; k++){ const d = D[k]; if(d.maxL<0 || d.eta > minEta + 3600000) continue; if(d.delayH < best - 1/60){ best = d.delayH; bi = k; } }

}

let stormLayer=null, trackLayer=null, truckMarker=null, stormRenderer=null, stormTimer=null;
async function loadStorm(){
  if(!STATE || !STATE.routes) return;
  const my = STATE;
  $("cardStorm").classList.remove("hidden"); $("stormInfo").textContent = t("storm.loading");
  const all = STATE.routes.flatMap(r => r.route.coords);
  let la0=90, la1=-90, lo0=180, lo1=-180;
  all.forEach(p => { la0=Math.min(la0,p[0]); la1=Math.max(la1,p[0]); lo0=Math.min(lo0,p[1]); lo1=Math.max(lo1,p[1]); });
  const mLa = 1.5, mLo = 2.0; la0-=mLa; la1+=mLa; lo0-=mLo; lo1+=mLo;
  const k = Math.cos((la0+la1)/2*Math.PI/180);
  const w = (lo1-lo0)*k, h = (la1-la0);
  let nx = 16, ny = Math.round(nx*h/w); ny = Math.max(8, Math.min(18, ny)); if(ny*nx > 220) nx = Math.floor(220/ny);
  const dLat = h/ny, dLon = (lo1-lo0)/nx, cells=[];
  for(let y=0;y<ny;y++) for(let x=0;x<nx;x++) cells.push({lat:+(la0+dLat*(y+.5)).toFixed(3), lon:+(lo0+dLon*(x+.5)).toFixed(3)});
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${cells.map(c=>c.lat).join(",")}&longitude=${cells.map(c=>c.lon).join(",")}`+
    `&hourly=precipitation,snowfall,weather_code,wind_gusts_10m&forecast_days=4&timeformat=unixtime&timezone=GMT&wind_speed_unit=kmh`;
  try{
    let j = await getJSON(url, {}, 45000); j = Array.isArray(j) ? j : [j];
    if(STATE !== my) return;
    STATE.storm = {cells, dLat, dLon, data:j, t0:j[0].hourly.time[0]};
    analyzeStorm(); renderStorm(+$("stormT").value);
  }catch(e){ $("stormInfo").textContent = t("storm.fail"); }
}
function stormCat(h, i){ // категория клетки в час i
  const s = h.snowfall[i]||0, p = h.precipitation[i]||0, c = h.weather_code[i], g = h.wind_gusts_10m[i]||0;
  if([56,57,66,67].includes(c) && p>=0.1) return {col:"#ec4899", op:.55, w:3};
  if(s>=2.5 || (s>=1 && g>=60)) return {col:"#a21caf", op:.6, w:3};
  if(s>=1) return {col:"#3b82f6", op:.48, w:2};
  if(s>=0.2) return {col:"#93c5fd", op:.4, w:1};
  if(p>=1) return {col:"#86efac", op:.3, w:0};
  return null;
}
function analyzeStorm(){
  const st = STATE.storm, n = st.data[0].hourly.time.length, base = Math.round((STATE.startH/1000 - st.t0)/3600);
  st.track = []; st.lastSnow = -1; st.anySnow = false;
  for(let hh=0; hh<=72; hh++){
    const i = base+hh; if(i<0 || i>=n) continue;
    let W=0, la=0, lo=0;
    st.data.forEach((loc, ci) => { const s = loc.hourly.snowfall[i]||0; if(s>=0.3){ W+=s; la+=s*st.cells[ci].lat; lo+=s*st.cells[ci].lon; } });
    if(W>=1.5){ st.track.push({h:hh, lat:la/W, lon:lo/W, W}); st.lastSnow = hh; st.anySnow = true; }
  }
  st.base = base;
  // трек на карте
  if(!map) return;
  if(!trackLayer) trackLayer = L.layerGroup().addTo(map);
  trackLayer.clearLayers();
  if(!$("stormOn").checked) return;
  // разбиваем трек на куски, если был перерыв
  let seg=[];
  const flush = () => { if(seg.length>1) L.polyline(seg.map(p=>[p.lat,p.lon]), {color:"#0f172a", weight:3, dashArray:"6 6", opacity:.8}).addTo(trackLayer); seg=[]; };
  st.track.forEach((p, idx) => {
    if(idx && p.h - st.track[idx-1].h > 2) flush();
    seg.push(p);
    if(p.h % 6 === 0) L.marker([p.lat,p.lon], {interactive:false, icon:L.divIcon({className:"", html:`<div class="stormlbl">${fmtT(STATE.startH+p.h*3600000)}</div>`, iconSize:[70,16], iconAnchor:[-6,8]})}).addTo(trackLayer);
    if(p.h % 6 === 0) L.circleMarker([p.lat,p.lon], {radius:4, color:"#0f172a", weight:2, fillColor:"#fff", fillOpacity:1, interactive:false}).addTo(trackLayer);
  });
  flush();
}
const DIRS = {ru:["север","северо-восток","восток","юго-восток","юг","юго-запад","запад","северо-запад"],
  uk:["північ","північний схід","схід","південний схід","південь","південний захід","захід","північний захід"],
  en:["north","northeast","east","southeast","south","southwest","west","northwest"]};
function motionAt(hh){
  const tr = STATE.storm.track, a = tr.find(p=>p.h>=hh-1 && p.h<=hh+1) , b = a && tr.find(p=>p.h>=a.h+3 && p.h<=a.h+4);
  if(!a || !b) return null;
  const km = hav([a.lat,a.lon],[b.lat,b.lon]), hrs = b.h-a.h;
  const brg = (Math.atan2((b.lon-a.lon)*Math.cos(a.lat*Math.PI/180), b.lat-a.lat)*180/Math.PI + 360) % 360;
  const dir = (DIRS[S.lang||detectLang()]||DIRS.en)[Math.round(brg/45)%8];
  return {dir, kmh: km/hrs};
}
function truckPos(tMs){ // где трак в момент tMs: интерполяция по пройденным километрам
  const d = STATE.deps && STATE.deps[STATE.sel||0]; if(!d) return null;
  const R = d.rows; if(tMs < d.dep || tMs > d.eta + 1800000) return null;
  const c = STATE.route.coords, cum = STATE.sp.cum;
  const atKm = km => { let lo = 0, hi = cum.length-1; while(lo < hi){ const m = (lo+hi)>>1; if(cum[m] < km) lo = m+1; else hi = m; }
    if(lo === 0) return {p:c[0], i:0}; const f = (km - cum[lo-1]) / Math.max(1e-9, cum[lo]-cum[lo-1]);
    return {p:[c[lo-1][0]+(c[lo][0]-c[lo-1][0])*f, c[lo-1][1]+(c[lo][1]-c[lo-1][1])*f], i:lo}; };
  if(tMs <= R[0].t) return {pos:[R[0].p.lat, R[0].p.lon], km:0, row:0};
  for(let i=0;i<R.length-1;i++){
    if(tMs < R[i+1].t){
      // стоянка (шторм, отдых) — между точками время может «стоять»: трак ждёт на месте
      const f = (tMs-R[i].t)/(R[i+1].t-R[i].t), km = R[i].p.km + (R[i+1].p.km - R[i].p.km)*f;
      return {pos: atKm(km).p, km, row:i};
    }
  }
  const L = R[R.length-1]; return {pos:[L.p.lat, L.p.lon], km:L.p.km, row:R.length-1};
}
const SL_STEP = 15*60000; // шаг ползунка — 15 мин
function sliderTime(v){
  const d = STATE && STATE.deps && STATE.deps[STATE.sel||0]; if(!d) return Date.now();
  return d.dep + (v==null ? +$("stormT").value : v) * SL_STEP;
}
function setupSlider(){ // ползунок = от выезда до прибытия
  const d = STATE.deps[STATE.sel||0]; if(!d) return;
  const max = Math.max(1, Math.ceil((d.eta - d.dep)/SL_STEP));
  const el = $("stormT"); el.max = max;
  if(STATE.slDep !== d.dep){ STATE.slDep = d.dep; el.value = 0; stopStorm(); }
  if(+el.value > max) el.value = max;
}
function renderStorm(v){
  if(!STATE || !STATE.storm) return;
  setupSlider(); v = +$("stormT").value;
  const tMs = sliderTime(v), hh = Math.round((tMs - STATE.startH)/3600000);
  const st = STATE.storm, i = st.base + hh;
  $("stormTime").textContent = fmtT(tMs);
  $("stormRel").textContent = v===0 ? t("storm.atDep") : t("storm.sinceDep",{d:fmtDur(v*SL_STEP/3600000)});
  if(map){
    if(!stormRenderer) stormRenderer = L.canvas ? L.canvas({padding:.3}) : undefined;
    if(!stormLayer) stormLayer = L.layerGroup().addTo(map);
    stormLayer.clearLayers();
    if($("stormOn").checked){
      st.data.forEach((loc, ci) => {
        const cat = stormCat(loc.hourly, i); if(!cat) return;
        const c = st.cells[ci];
        L.rectangle([[c.lat-st.dLat/2, c.lon-st.dLon/2],[c.lat+st.dLat/2, c.lon+st.dLon/2]], {stroke:false, fillColor:cat.col, fillOpacity:cat.op, renderer:stormRenderer, interactive:false}).addTo(stormLayer);
      });
      const cur = st.track.find(p=>p.h===hh);
      if(cur) L.circleMarker([cur.lat,cur.lon], {radius:9, color:"#fff", weight:3, fillColor:"#a21caf", fillOpacity:1, interactive:false}).addTo(stormLayer);
    }
    const tp = truckPos(tMs);
    if(truckMarker){ truckMarker.remove(); truckMarker=null; }
    if(tp) truckMarker = L.marker(tp.pos, {interactive:false, zIndexOffset:1000, icon:L.divIcon({className:"", html:`<div class="truckico">🚚</div>`, iconSize:[24,24], iconAnchor:[12,12]})}).addTo(map);
  }
  // пояснение
  const info = [];
  if(!st.anySnow) info.push(t("storm.none"));
  else {
    const mv = motionAt(hh) || motionAt(st.track[0].h);
    if(mv) info.push(t("storm.moving",{dir:mv.dir, spd: IMP() ? Math.round(mv.kmh/1.609)+" mph" : Math.round(mv.kmh)+" "+t("kmh")}));
    const first = st.track[0].h;
    if(first > hh) info.push(t("storm.starts",{t:fmtT(STATE.startH+first*3600000)}));
    info.push(st.lastSnow >= 72 ? t("storm.longer") : t("storm.until",{t:fmtT(STATE.startH+(st.lastSnow+1)*3600000)}));
  }
  const tp2 = truckPos(tMs);
  if(tp2){ const pt = STATE.sp.pts[tp2.row], nm = pt && pt.name ? " ("+pt.name+")" : "";
    info.unshift("🚚 " + t("storm.truckAt",{t:fmtT(tMs), p:U.mark(tp2.km)+nm})); }
  $("stormInfo").innerHTML = info.map(x=>"<div>"+esc(x)+"</div>").join("");
}
$("stormT").oninput = () => { stopStorm(); renderStorm(+$("stormT").value); };
function stopStorm(){ if(stormTimer){ clearInterval(stormTimer); stormTimer=null; $("stormPlay").textContent = "▶"; } }

function buildZones(d){
  const Z = []; let cur = null;
  d.rows.forEach((r, i) => {
    if(r.a.lvl > 0){
      if(!cur){ cur = {i0:i, i1:i, maxL:r.a.lvl, why:new Set(r.a.why), t0:r.t, t1:r.t, tmin:null, snow:0, gust:0, prob:null}; Z.push(cur); }
      cur.i1 = i; cur.t1 = r.t; cur.maxL = Math.max(cur.maxL, r.a.lvl); r.a.why.forEach(w => cur.why.add(w));
      const v = r.v || {};
      if(v.temp!=null) cur.tmin = cur.tmin==null ? v.temp : Math.min(cur.tmin, v.temp);
      cur.snow = Math.max(cur.snow, v.snow||0); cur.gust = Math.max(cur.gust, v.gust||0);
      if(r.pr!=null) cur.prob = Math.max(cur.prob||0, r.pr);
    } else cur = null;
  });
  return Z;
}

/* ============ мост Конфедерации (PEI) ============ */
const CBR = {lat:46.205, lon:-63.752, a:[46.162,-63.812], b:[46.247,-63.692]};
let BRW = null; // прогноз ветра на мосту
async function loadBridgeWind(){
  try{
    const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${CBR.lat}&longitude=${CBR.lon}&hourly=wind_speed_10m,wind_gusts_10m&forecast_days=4&past_days=1&timeformat=unixtime&timezone=GMT&wind_speed_unit=kmh`, {}, 20000);
    BRW = {time:j.hourly.time, ws:j.hourly.wind_speed_10m, wg:j.hourly.wind_gusts_10m};
  }catch(e){ BRW = null; }
}
function bridgeAt(tSec){ // 3 — ограничение для высоких ТС (официально: ветер >70 и порывы >85 км/ч); 2 — опасно для пустого
  if(!BRW) return null;
  const i = Math.round((tSec - BRW.time[0])/3600); if(i<0 || i>=BRW.time.length) return null;
  const ws = BRW.ws[i]||0, wg = BRW.wg[i]||0;
  const lvl = (ws > 70 && wg > 85) ? 3 : (isLight() && (ws >= 55 || wg >= 70)) ? 2 : (ws >= 50 || wg >= 65) ? 1 : 0;
  return {lvl, ws, wg};
}
function bridgeOpenAt(tSec){ // когда ограничение снимется
  for(let k=1; k<=72; k++){ const b = bridgeAt(tSec + k*3600); if(!b) return null; if(b.lvl < 3) return tSec + k*3600; }
  return null;
}
function routeBridgeIdx(sp, route){ // индекс точки маршрута у моста или -1
  let best = -1, bd = 1e9;
  sp.pts.forEach((p, i) => { const d = hav([p.lat,p.lon],[CBR.lat,CBR.lon]); if(d < bd){ bd = d; best = i; } });
  if(bd > 25) return -1;
  // маршрут действительно идёт по мосту?
  const on = route.coords.some(c => hav(c, [CBR.lat, CBR.lon]) < 4);
  return on ? best : -1;
}
let bridgeMarker = null;
function bridgePopup(){
  const now = Date.now()/1000, cur = bridgeAt(now);

function beep(times){
  try{
    const ac = DRIVE.audio || (DRIVE.audio = new (window.AudioContext||window.webkitAudioContext)());
    for(let k=0;k<(times||2);k++){ const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      const t0 = ac.currentTime + k*0.35; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.4,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.25); o.start(t0); o.stop(t0+0.3); }
  }catch(e){}
}

async function refreshWeather(){ // обновить прогноз по тем же маршрутам, без перестроения
  if(!STATE || !STATE.routes) return;
  try{
    const allPts = STATE.routes.flatMap(r => r.sp.pts);
    const [fc, ens] = await Promise.all([fetchForecast(allPts), fetchEnsemble(allPts).catch(()=>null)]);
    let k = 0; STATE.routes.forEach(r => { const m = r.sp.pts.length; r.fc = fc.slice(k, k+m); r.ens = ens ? ens.slice(k, k+m) : null; k += m; });

function onDrivePos(pos){
  const lat = pos.coords.latitude, lon = pos.coords.longitude;
  lastFix = {lat:+lat.toFixed(5), lon:+lon.toFixed(5)};
  showMe(lat, lon, pos.coords.accuracy);
  if(map && DRIVE.follow && document.body.classList.contains("mapfull")) map.setView([lat, lon], Math.max(map.getZoom ? map.getZoom() : 9, 9));
  const now = Date.now();
  // сошли с маршрута? (две точки подряд дальше 400 м) → перестроить, не чаще раза в 90 с
  const off = distToRoute(lat, lon);
  if(off > 0.4){ DRIVE.offCount = (DRIVE.offCount||0) + 1; } else DRIVE.offCount = 0;
  if(DRIVE.offCount >= 2 && now - (DRIVE.lastReroute||0) > 90000 && (pos.coords.accuracy||0) < 150){
    DRIVE.lastReroute = now; DRIVE.offCount = 0; $("dbText").textContent = t("st.reroute"); quickReroute(); return;
  }
  if(now - DRIVE.lastCheck < 20000) return; DRIVE.lastCheck = now;
  checkAhead(lat, lon, now);
}
function distToRoute(lat, lon){ // км до линии маршрута, заодно обновляет DRIVE.idx
  const c = STATE.route.coords; let bi = DRIVE.idx, bd = 1e9;
  const from = Math.max(0, DRIVE.idx - 30), to = Math.min(c.length-1, DRIVE.idx + 3000);
  for(let i=from; i<=to; i++){ const d = hav(c[i], [lat,lon]); if(d < bd){ bd = d; bi = i; } }
  if(bd > 5){ for(let i=0; i<c.length; i+=2){ const d = hav(c[i],[lat,lon]); if(d < bd){ bd = d; bi = i; } } }
  // уточнение по отрезку (точки линии бывают редкими)
  const seg = (p, q) => { const k = Math.cos(lat*Math.PI/180), ax=(q[1]-p[1])*k, ay=q[0]-p[0], bx=(lon-p[1])*k, by=lat-p[0], L2=ax*ax+ay*ay;
    const tt = L2 ? Math.max(0, Math.min(1, (ax*bx+ay*by)/L2)) : 0; return hav([lat,lon],[p[0]+ay*tt, p[1]+(ax/k)*tt]); };
  if(bi > 0) bd = Math.min(bd, seg(c[bi-1], c[bi])); if(bi < c.length-1) bd = Math.min(bd, seg(c[bi], c[bi+1]));
  DRIVE.idx = bi; return bd;
}
function checkAhead(lat, lon, now){
  const c = STATE.route.coords, cum = STATE.sp.cum; if(!cum) return;
  // ближайшая точка маршрута (ищем вперёд от прошлой позиции, но не назад далеко)
  let bi = DRIVE.idx, bd = 1e9;
  const from = Math.max(0, DRIVE.idx - 30), to = Math.min(c.length-1, DRIVE.idx + 3000);
  for(let i=from; i<=to; i++){ const d = hav(c[i], [lat,lon]); if(d < bd){ bd = d; bi = i; } }
  if(bd > 5){ for(let i=0; i<c.length; i+=3){ const d = hav(c[i],[lat,lon]); if(d < bd){ bd = d; bi = i; } } }
  DRIVE.idx = bi;
  if(bd > 3){ $("dbText").textContent = t("dr.offRoute",{d:U.dist(bd)}); return; }
  const curKm = cum[bi], pts = STATE.sp.pts;
  const vAvg = Math.min(STATE.sp.totalKm / STATE.sp.durH, (inCanada(lat,lon) ? (Number(S.avgCA)||59) : (Number(S.avgUS)||60))*MPH);
  const lead = (S.alertMin==null ? 60 : Number(S.alertMin)) * 60000;
  let found = null;
  for(let i=0; i<pts.length; i++){
    const p = pts[i]; if(p.km <= curKm) continue;
    const tt = now + (p.km - curKm)/vAvg*3600000; if(tt - now > Math.max(lead, 60*60000) + 45*60000) break;
    const v = valAt(STATE.fc[i], tt/1000), pr = STATE.ens ? probAt(STATE.ens[i], tt/1000) : null, a = assess(v, pr);
    if(STATE.cur.bridgeAt === i){ const b = bridgeAt(tt/1000); if(b && b.lvl>=2){ a.lvl = Math.max(a.lvl, b.lvl); a.why.push(b.lvl>=3 ? "w.bridgeRestr" : "w.bridgeLight"); } }
    if(a.lvl >= 1){ found = {i, p, tt, a}; break; }
  }
  if(!found){ $("dbText").textContent = t("dr.clear",{h:fmtDur(Math.max(lead, 3600000)/3600000)}); return; }
  const mins = Math.max(0, Math.round((found.tt - now)/60000));
  const place = U.mark(found.p.km) + (found.p.name ? " ("+found.p.name+")" : "");
  $("dbText").textContent = t("dr.next",{m:fmtDur(mins/60), p:place, lv:t("lv"+found.a.lvl)});
  const key1 = found.i+"|"+found.a.lvl, key2 = key1+"|near";
  let fire = false;
  if(found.tt - now <= lead && !DRIVE.alerted.has(key1)){ DRIVE.alerted.add(key1); fire = true; }
  else if(found.a.lvl >= 2 && found.tt - now <= 15*60000 && !DRIVE.alerted.has(key2)){ DRIVE.alerted.add(key2); fire = true; }
  if(fire){
    const txt = t("dr.alert",{m:fmtDur(mins/60), p:place, why:whyTxt(found.a.why)}) + " " + t("zn.adv"+found.a.lvl);
    const box = $("driveAlert"); box.className = "dalert l"+found.a.lvl; $("daText").textContent = "⚠ "+txt; box.style.display = "block";
    beep(found.a.lvl>=2 ? 3 : 2); say(txt);
  }
}

  const search = async q => {
    const ql = q.toLowerCase();
    const mine = PLACES.filter(p => !ql || (p.name+" "+(p.note||"")).toLowerCase().includes(ql)).slice(-6).reverse()
      .map(p => ({main: plIcon(p.type)+" "+p.name, sub: p.note||"", lat:p.lat, lon:p.lon, mine:true}));
    const local = mine.concat(PRESETS.filter(p => p[0].toLowerCase().includes(ql)).slice(0, ql ? 3 : 0).map(p => ({main:p[0], sub:"", lat:p[1], lon:p[2]})));
    render(local, q.length>=2 ? t("ac.searching") : "");
    if(q.length < 2) return;
    if(ctl) ctl.abort(); ctl = new AbortController();
    const bias = lastFix || {lat:44.5, lon:-68.5};
    try{
      const j = {features: await photonSearch(q, {bias, signal:ctl.signal})};
      const seen = new Set(local.map(x=>x.main.toLowerCase()));
      const remote = (j.features||[]).map(f => Object.assign(fmtPlace(f.properties), {lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0]}))
        .filter(x => x.main && !seen.has((x.main+", "+x.sub).toLowerCase()) && (seen.add((x.main+", "+x.sub).toLowerCase()), true));
      const all = local.concat(remote);
      render(all, all.length ? "" : t("ac.none"));
    }catch(e){ if(e.name!=="AbortError") render(local, t("ac.offline")); }
  };
  input.addEventListener("input", () => {
    delete input.dataset.lat; delete input.dataset.lon; delete input.dataset.geo;
    clearTimeout(timer); const q = input.value.trim();
    timer = setTimeout(() => search(q), 250);
  });
  input.addEventListener("focus", () => {
    if(input.dataset.geo==="1" || /^📍/.test(input.value)) input.select();
    search(input.value.trim().replace(/^📍\s*/,"") && !input.dataset.lat ? input.value.trim() : "");
  });
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("keydown", e => {
    if(e.key==="Enter"){ e.preventDefault(); if(items[0] && !input.dataset.lat) choose(items[0]); else { close(); if(!isFrom) run(); else $("to").focus(); } }
  });
}
function syncClr(){ ["from","to"].forEach(id => $(id).parentElement.classList.toggle("has", !!$(id).value)); }
document.querySelectorAll(".clr").forEach(b => {
  b.addEventListener("pointerdown", e => e.preventDefault());
  b.onclick = () => { const el = $(b.dataset.for); el.value = ""; delete el.dataset.lat; delete el.dataset.lon; delete el.dataset.geo; syncClr(); saveLast(); el.focus(); el.dispatchEvent(new Event("input")); };
});
["from","to"].forEach(id => $(id).addEventListener("input", () => { syncClr(); updateToLinks(); }));
setupAC($("from"), $("acFrom"), true);
setupAC($("to"), $("acTo"), false);

// адреса по умолчанию для теста (ставятся один раз)
const DEF_FROM = "910 Frenette Ave, Moncton, NB E1H 2P8", DEF_TO = "900 Fairmount Ave, Elizabeth, NJ 07201, United States";
if(!LS.get("defaults_v1", false)){ LS.set("defaults_v1", true); LS.set("last", {from:DEF_FROM, to:DEF_TO}); }
const last = LS.get("last", null) || {from:DEF_FROM, to:DEF_TO};
if(last){
  $("from").value = last.from||""; $("to").value = last.to||"";
  if(last.fLat){ $("from").dataset.lat = last.fLat; $("from").dataset.lon = last.fLon; if(last.fGeo) $("from").dataset.geo = "1"; }
  if(last.tLat){ $("to").dataset.lat = last.tLat; $("to").dataset.lon = last.tLon; }
  if(last.appt && new Date(last.appt).getTime() > Date.now()) $("appt").value = last.appt;
}
fillXingSelect(); $("xing").addEventListener("change", () => { saveLast(); drawXings(); });
syncClr(); updateToLinks();
initMap();
window.addEventListener("resize", () => { if(map) setTimeout(() => map.invalidateSize(), 200); });
applyUnits();
if(!S.units || !S.lang){
  $("unitsPick").style.display = "block";
  const cur = S.lang || detectLang();
  document.querySelectorAll("#unitsPick [data-l]").forEach(x => x.classList.toggle("sec", x.dataset.l!==cur));
}
// если доступ к геолокации уже разрешён — сразу берём текущее место (без лишних вопросов)
(async () => {
  try{
    const st = navigator.permissions ? await navigator.permissions.query({name:"geolocation"}) : null;
    const f = $("from");
    if(st && st.state==="granted" && (!f.value || f.dataset.geo==="1")) locate({silent:true});
    else if(!f.value) status(t("geo.hint"));
  }catch(e){}
})();
// автообновление каждые 30 минут, пока приложение открыто
setInterval(() => { if(STATE && document.visibilityState==="visible" && !DRIVE.on) run(); }, 30*60*1000);
</script>
