<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>TruckWX — погода на маршруте</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#0284c7; --accent-text:#fff;
  --l0:#16a34a; --l1:#eab308; --l2:#f97316; --l3:#dc2626; --lna:#94a3b8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1220; --card:#131c2e; --text:#e2e8f0; --muted:#94a3b8; --line:#23304a; --accent:#38bdf8; --accent-text:#0b1220; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:1000;background:#0f172a;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header small{color:#94a3b8;font-weight:400}
.iconbtn{background:transparent;border:1px solid #334155;color:#fff;border-radius:10px;padding:6px 10px;font-size:15px}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 24px);max-width:900px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--line)}
.card h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1}
.btn{display:inline-block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font-size:16px;font-weight:600;margin-top:12px}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent);font-weight:500}
.btn:disabled{opacity:.5}
.small{font-size:12px;color:var(--muted)}
#status{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
#map{height:46vh;min-height:280px;border-radius:14px;margin-bottom:12px;border:1px solid var(--line)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.dep{flex:0 0 auto;min-width:78px;border-radius:12px;padding:8px 8px 6px;text-align:center;border:2px solid transparent;scroll-snap-align:start;color:#fff;font-size:12px}
.dep b{display:block;font-size:15px}
.dep.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--card) inset}
.dep .p{opacity:.95}
.lv0{background:var(--l0)} .lv1{background:var(--l1);color:#1f1300} .lv2{background:var(--l2)} .lv3{background:var(--l3)} .lvna{background:var(--lna)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.badge.lv1{color:#1f1300}
.summary{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.big{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.alert{border-left:4px solid var(--l2);padding:8px 10px;margin:8px 0;background:var(--bg);border-radius:8px}
.alert.sev{border-color:var(--l3)}
.alert b{display:block}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:4px}
.links a{display:inline-block;margin:4px 6px 4px 0;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--accent);text-decoration:none;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.langrow{display:flex;gap:8px}.langrow .btn{margin-top:6px;padding:11px 6px;font-size:15px}
@media (max-width:420px){ header h1 small{display:none} }
.alt{display:flex;width:100%;text-align:left;gap:10px;align-items:stretch;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:10px;margin-top:8px;color:var(--text);font-size:14px}
.alt.sel{border-color:var(--accent);background:var(--card)}
.alt .bar{flex:0 0 6px;border-radius:4px}
.alt .body{flex:1;min-width:0}
.alt .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.alt .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt .time{font-size:20px;font-weight:700;white-space:nowrap}
.alt .sub{color:var(--muted);font-size:12px;margin-top:2px}
.alt .tags{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--text)}
.tag.good{background:#dcfce7;color:#14532d}.tag.toll{background:#fef3c7;color:#78350f}
@media (prefers-color-scheme: dark){ .tag.good{background:#14532d;color:#dcfce7}.tag.toll{background:#422006;color:#fde68a} }
.rlabel{background:#fff;border:2px solid;border-radius:50%;width:26px;height:26px;line-height:22px;text-align:center;font-weight:800;font-size:14px;color:#0f172a}
/* планшет и широкий экран: карта слева на всю высоту, панели справа */
@media (min-width: 880px){
  main{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:0 16px;align-items:start}
  main > *{grid-column:2}
  #map{grid-column:1;grid-row:1 / span 40;position:sticky;top:76px;height:calc(100vh - 96px);margin-bottom:0}
  .card{margin-bottom:12px}
}
@media (min-width: 1300px){ main{grid-template-columns:minmax(0,1fr) 520px} }
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2500;display:none;padding:0 16px}
body.metric .imp-only{display:none} body:not(.metric) .met-only{display:none}
#settings{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 12px 40px}
#settings .card{max-width:560px;margin:0 auto}
.hidden{display:none}
.warnbox{background:#fef3c7;color:#78350f;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
@media (prefers-color-scheme: dark){ .warnbox{background:#422006;color:#fde68a} }
.leaflet-popup-content{font-size:13px}
.acwrap{position:relative;flex:1}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:1500;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
.ac.open{display:block}
.ac button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;color:var(--text);font-size:15px}
.ac button:last-child{border-bottom:0}
.ac button small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.ac button.me{color:var(--accent);font-weight:600}
.ac .hint{padding:10px 12px;font-size:13px;color:var(--muted)}
.geobtn{flex:0 0 auto !important;color:var(--accent) !important;border-color:var(--line) !important;padding:11px 10px !important;white-space:nowrap}
.eta{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.eta .big{display:block}
.eta ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.dep .a{display:block;font-size:11px;opacity:.95;margin-top:2px}
tr.ev td{background:var(--bg);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>TruckWX <small data-i18n="sub"></small></h1>
  <button class="iconbtn" id="btnLang" aria-label="Language">RU</button>
  <button class="iconbtn" id="btnUnits" aria-label="Units">mi</button>
  <button class="iconbtn" id="btnSettings" data-i18n-title="set.h">&#9881;</button>
</header>

<main>
  <div class="card">
    <label for="from" data-i18n="from"></label>
    <div class="row">
      <div class="acwrap"><input id="from" data-i18n-ph="ph.addr" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next"><div class="ac" id="acFrom"></div></div>
      <button class="iconbtn geobtn" id="btnGeo" data-i18n="geo.btn"></button>
    </div>
    <label for="to" data-i18n="to"></label>
    <div class="acwrap"><input id="to" data-i18n-ph="ph.addr" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><div class="ac" id="acTo"></div></div>
    <button class="btn" id="btnGo" data-i18n="go"></button>
    <div id="status"></div>
    <div id="routeWarn" class="warnbox hidden"></div>
  </div>

  <div id="map"></div>

  <div class="card hidden" id="cardAlts">
    <h2 data-i18n="alts.h"></h2>
    <div id="altsFor" class="small"></div>
    <div id="alts"></div>
    <div id="altsRec" class="small" style="margin-top:6px"></div>
  </div>

  <div class="card hidden" id="cardDeps">
    <h2 data-i18n="deps.h"></h2>
    <div class="strip" id="strip"></div>
    <div class="legend">
      <span><span class="dot lv0"></span><span data-i18n="lv0"></span></span>
      <span><span class="dot lv1"></span><span data-i18n="lv1"></span></span>
      <span><span class="dot lv2"></span><span data-i18n="lv2"></span></span>
      <span><span class="dot lv3"></span><span data-i18n="lv3"></span></span>
      <span data-i18n="legend.pct"></span>
    </div>
    <div id="bestTip" class="small" style="margin-top:6px"></div>
  </div>

  <div class="card hidden" id="cardTrip">
    <h2><span data-i18n="trip.dep"></span> <span id="tripDep"></span></h2>
    <div class="summary">
      <span id="tripBadge" class="badge"></span>
      <span id="tripText"></span>
    </div>
    <div class="eta" id="eta"></div>
    <div class="small" id="tripMeta"></div>
    <div style="overflow-x:auto;margin-top:8px">
      <table>
        <thead><tr><th data-i18n="th.time"></th><th data-i18n="th.where"></th><th id="thT">t°</th><th id="thS"></th><th id="thW"></th><th data-i18n="th.prob"></th></tr></thead>
        <tbody id="tripRows"></tbody>
      </table>
    </div>
  </div>

  <div class="card hidden" id="cardAlerts">
    <h2 data-i18n="alerts.h"></h2>
    <div id="alerts" class="small">—</div>
  </div>

  <div class="card hidden" id="cardBridges">
    <h2 data-i18n="bridges.h"></h2>
    <div id="bridges" class="small">—</div>
  </div>

  <div class="card hidden" id="cardRoads">
    <h2 data-i18n="roads.h"></h2>
    <div class="small" data-i18n="roads.txt"></div>
    <div class="links" id="roadLinks"></div>
    <div class="small" style="margin-top:6px" data-i18n="border"></div>
    <div class="links">
      <a href="https://bwt.cbp.gov/" target="_blank" rel="noopener" data-i18n="cbp"></a>
      <a href="https://www.cbsa-asfc.gc.ca/bwt-taf/menu-eng.html" target="_blank" rel="noopener" data-i18n="cbsa"></a>
    </div>
    <div class="links" id="navLinks"></div>
  </div>

  <p class="small"><span data-i18n="footer"></span> <span data-i18n="updated"></span> <span id="updated">—</span></p>
</main>

<div id="unitsPick" class="modal">
  <div class="card" style="max-width:420px;margin:10vh auto 0">
    <h2>Язык · Мова · Language</h2>
    <div class="langrow">
      <button class="btn sec" data-l="ru">Русский</button>
      <button class="btn sec" data-l="uk">Українська</button>
      <button class="btn sec" data-l="en">English</button>
    </div>
    <h2 style="margin-top:16px" data-i18n="pick.q"></h2>
    <div class="small" data-i18n="pick.txt"></div>
    <button class="btn" data-u="imperial" data-i18n="u.imp"></button>
    <button class="btn sec" data-u="metric" data-i18n="u.met"></button>
  </div>
</div>
<div id="settings">
  <div class="card">
    <h2 data-i18n="set.h"></h2>
    <label data-i18n="set.lang"></label>
    <select id="sLang"><option value="ru">Русский</option><option value="uk">Українська</option><option value="en">English</option></select>
    <label data-i18n="set.units"></label>
    <select id="sUnits"><option value="imperial" data-i18n="u.imp"></option><option value="metric" data-i18n="u.met"></option></select>
    <label data-i18n="set.key"></label>
    <input id="sKey" data-i18n-ph="set.keyph" autocomplete="off">
    <div class="small" data-i18n="set.keyhelp"></div>
    <div class="imp-only">
      <div class="row">
        <div><label data-i18n="set.hft"></label><input id="sHft" type="number" inputmode="numeric"></div>
        <div><label data-i18n="set.hin"></label><input id="sHin" type="number" inputmode="numeric"></div>
      </div>
      <div class="row">
        <div><label data-i18n="set.wlb"></label><input id="sWlb" type="number" inputmode="numeric"></div>
        <div><label data-i18n="set.lft"></label><input id="sLft" type="number" inputmode="numeric"></div>
      </div>
    </div>
    <div class="met-only">
      <div class="row">
        <div><label data-i18n="set.hm"></label><input id="sHm" type="number" step="0.01" inputmode="decimal"></div>
        <div><label data-i18n="set.wt"></label><input id="sW" type="number" inputmode="decimal"></div>
      </div>
      <label data-i18n="set.lm"></label><input id="sL" type="number" inputmode="decimal">
    </div>
    <label data-i18n="set.tolls"></label>
    <select id="sTolls"><option value="allow" data-i18n="set.tollsAllow"></option><option value="avoid" data-i18n="set.tollsAvoid"></option></select>
    <label data-i18n="set.speed"></label>
    <input id="sSpeed" type="number" step="0.05" inputmode="decimal" value="1.1">
    <label data-i18n="set.empty"></label>
    <select id="sEmpty"><option value="0" data-i18n="set.loaded"></option><option value="1" data-i18n="set.emptyY"></option></select>
    <h2 style="margin-top:18px" data-i18n="set.eta"></h2>
    <div class="row">
      <div><label><span data-i18n="set.vmax"></span> <span class="uSpd">mph</span></label><input id="sVmax" type="number" inputmode="numeric" value="65"></div>
      <div><label data-i18n="set.storm"></label><select id="sStorm"><option value="wait" data-i18n="set.wait"></option><option value="slow" id="optSlow"></option></select></div>
    </div>
    <div class="row">
      <div><label data-i18n="set.clear"></label><input id="sClear" type="number" step="0.5" inputmode="decimal" value="1.5"></div>
      <div><label><span data-i18n="set.rmph"></span> <span class="uSpd">mph</span></label><input id="sRmph" type="number" inputmode="numeric" value="45"></div>
    </div>
    <div class="row">
      <div><label data-i18n="set.rh"></label><input id="sRh" type="number" step="0.5" inputmode="decimal" value="6"></div>
      <div><label data-i18n="set.work"></label><input id="sWork" type="number" inputmode="numeric" value="20"></div>
    </div>
    <div class="row">
      <div><label data-i18n="set.traffic"></label><select id="sTraffic"><option value="1" data-i18n="set.consider"></option><option value="0" data-i18n="set.no"></option></select></div>
      <div><label data-i18n="set.hos"></label><select id="sHos"><option value="1" data-i18n="set.hosY"></option><option value="0" data-i18n="set.hosN"></option></select></div>
    </div>
    <button class="btn" id="btnSave" data-i18n="save"></button>
    <button class="btn sec" id="btnClose" data-i18n="close"></button>
  </div>
</div>

}

async function geocodeInput(el){
  if(el.dataset.lat) return {name: el.value, lat:+el.dataset.lat, lon:+el.dataset.lon};
  const q = el.value.trim() || el.placeholder;

async function geocode(q){
  q = q.trim();
  const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m) return {name:q, lat:+m[1], lon:+m[2]};
  const p = PRESETS.find(x => x[0].toLowerCase() === q.toLowerCase());
  if(p) return {name:p[0], lat:p[1], lon:p[2]};
  try{
    const j = await getJSON("https://photon.komoot.io/api/?limit=1&lang=en&bbox=-82,37,-52,50&q="+encodeURIComponent(q));
    const f = j.features && j.features[0];
    if(f){ const pr=f.properties; return {name:[pr.name, pr.city, pr.state].filter(Boolean).join(", "), lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0]}; }
  }catch(e){}
  const j2 = await getJSON("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca,us&q="+encodeURIComponent(q));
  if(j2 && j2[0]) return {name:j2[0].display_name.split(",").slice(0,3).join(","), lat:+j2[0].lat, lon:+j2[0].lon};
  throw new Error(t("err.addr")+" "+q);
}
async function revName(lat, lon){

  const pr = j.features && j.features[0] && j.features[0].properties;
  if(!pr) return null;
  return {place: pr.city || pr.town || pr.village || pr.county || pr.name || "", state: pr.state || "", cc: (pr.countrycode||"").toUpperCase()};
}

function roadSummary(pairs){ // [[name, meters]] -> "I-95 · ME-9"
  const m = new Map();
  pairs.forEach(([n, d]) => { if(!n || n==="-") return; n = String(n).split(/[;,]/)[0].trim().replace(/^I (\d)/,"I-$1").replace(/^(US|ME|NB|NS|NH|MA|NY|NJ|CT|RI|VT|QC|PA) (\d)/,"$1-$2");
    if(n) m.set(n, (m.get(n)||0) + d); });
  return [...m.entries()].sort((x,y)=>y[1]-x[1]).slice(0,2).map(x=>x[0]).join(" · ");
}
async function routeORS(a, b, via){
  const h = heightM(), pts = [a].concat(via||[], [b]);
  const opt = {vehicle_type:"hgv", profile_params:{restrictions:{height:+h.toFixed(2), width:2.6, length:Number(S.l)||22, weight:Number(S.w)||36}}};
  if(S.tolls==="avoid") opt.avoid_features = ["tollways"];
  const body = {coordinates: pts.map(p=>[p.lon,p.lat]), radiuses: pts.map(()=>-1), instructions:true, extra_info:["tollways"], options:opt};
  const j = await getJSON("https://api.openrouteservice.org/v2/directions/driving-hgv/geojson",
    {method:"POST", headers:{"Authorization":S.key, "Content-Type":"application/json"}, body:JSON.stringify(body)}, 40000);
  const f = j.features[0], pr = f.properties;
  const steps = (pr.segments||[]).flatMap(sg => sg.steps||[]);
  const tollV = pr.extras && pr.extras.tollways ? pr.extras.tollways.values : [];
  return {coords:f.geometry.coordinates.map(c=>[c[1],c[0]]), dist:pr.summary.distance, dur:pr.summary.duration, truck:true,
    roads: roadSummary(steps.map(st=>[st.name, st.distance])), toll: tollV.some(v => v[2]>0)};
}
function osrmParse(r){
  const steps = (r.legs||[]).flatMap(l => l.steps||[]);
  const toll = steps.some(st => (st.intersections||[]).some(x => (x.classes||[]).includes("toll")));
  const roads = steps.length ? roadSummary(steps.map(st=>[st.ref || st.name, st.distance])) : (r.legs||[]).map(l=>l.summary).filter(Boolean).join(" · ");
  return {coords:r.geometry.coordinates.map(c=>[c[1],c[0]]), dist:r.distance, dur:r.duration, truck:false, roads, toll};
}
async function routeOSRM(a, b, via, alts){
  const pts = [a].concat(via||[], [b]).map(p=>p.lon+","+p.lat).join(";");
  const ex = S.tolls==="avoid" ? "&exclude=toll" : "";
  let j;
  try{ j = await getJSON(`https://router.project-osrm.org/route/v1/driving/${pts}?overview=full&geometries=geojson&steps=true${alts?"&alternatives=3":""}${ex}`, {}, 30000); }
  catch(e){ if(!ex) throw e; j = await getJSON(`https://router.project-osrm.org/route/v1/driving/${pts}?overview=full&geometries=geojson&steps=true${alts?"&alternatives=3":""}`, {}, 30000); }
  return (j.routes||[]).map(osrmParse);
}
function viaPoints(a, b){ // точки в стороне от прямой — чтобы найти объезды
  const dk = hav([a.lat,a.lon],[b.lat,b.lon]); if(dk < 60) return [];
  const mLat = (a.lat+b.lat)/2, mLon = (a.lon+b.lon)/2, k = Math.cos(mLat*Math.PI/180);
  const dx = (b.lon-a.lon)*k, dy = (b.lat-a.lat), len = Math.hypot(dx, dy);
  const off = Math.min(0.22*len, 2.2);
  return [1,-1].map(sgn => ({lat: mLat + sgn*(dx/len)*off, lon: mLon - sgn*(dy/len)*off/k}));
}
function overlap(r1, r2){ // доля точек r1, лежащих рядом с r2
  const s2 = r2.coords.filter((_,i)=>i%5===0), s1 = r1.coords.filter((_,i,arr)=>i%Math.max(1,Math.floor(arr.length/60))===0);
  let near = 0;
  for(const p of s1){ for(const q of s2){ if(Math.abs(p[0]-q[0])<0.05 && Math.abs(p[1]-q[1])<0.07 && hav(p,q)<3){ near++; break; } } }
  return near/s1.length;
}
async function getRoutes(a, b){
  const cands = [];
  if(S.key){
    try{ cands.push(await routeORS(a, b)); }
    catch(e){ warn(t("w.orsfail",{e:e.message})); }
  } else warn(t("w.nokey"));
  status(t("st.alts"));
  const vias = viaPoints(a, b);
  const jobs = [];
  if(!cands.length || !S.key) jobs.push(routeOSRM(a, b, null, true).catch(()=>[]));
  vias.forEach(v => jobs.push(S.key ? routeORS(a, b, [v]).then(r=>[r]).catch(()=>routeOSRM(a, b, [v]).catch(()=>[])) : routeOSRM(a, b, [v]).catch(()=>[])));
  (await Promise.all(jobs)).forEach(list => list.forEach(r => cands.push(r)));
  if(!cands.length) throw new Error("route");
  // основной — самый быстрый; остальные — только если заметно другие и не слишком длинные
  const minDur = Math.min(...cands.map(r=>r.dur));
  const out = [];
  cands.sort((x,y)=>x.dur-y.dur).forEach(r => {
    if(out.length>=3 || r.dur > minDur*1.6) return;
    if(out.some(o => overlap(r,o) > 0.8)) return;
    out.push(r);
  });
  return out;
}
function samplePoints(route, target){
  const c = route.coords, cum=[0];
  for(let i=1;i<c.length;i++) cum.push(cum[i-1]+hav(c[i-1],c[i]));
  const total = cum[cum.length-1];
  const step = Math.max(25, total/(target||40));
  const pts=[]; let next=0;
  for(let i=0;i<c.length;i++){
    if(cum[i]>=next || i===c.length-1){ pts.push({lat:+c[i][0].toFixed(3), lon:+c[i][1].toFixed(3), km:cum[i], idx:i}); next = cum[i]+step; }
  }
  const durH = route.dur/3600*(Number(S.speed)||1);
  pts.forEach(p => p.offH = durH * (p.km/total));
  return {pts, totalKm:total, durH, cum};
}

async function fetchForecast(pts){

    `&forecast_days=5&past_days=1&timeformat=unixtime&timezone=GMT&wind_speed_unit=kmh`;

  return Array.isArray(j) ? j : [j];
}
async function fetchEnsemble(pts){
  const lat = pts.map(p=>p.lat).join(","), lon = pts.map(p=>p.lon).join(",");
  const url = `https://ensemble-api.open-meteo.com/v1/ensemble?latitude=${lat}&longitude=${lon}`+
    `&hourly=snowfall&models=gfs025&forecast_days=5&timeformat=unixtime&timezone=GMT`;
  let j = await getJSON(url, {}, 45000);
  j = Array.isArray(j) ? j : [j];
  // вероятность: доля членов ансамбля с >= 2 см снега за 3 часа (t-1..t+1)
  return j.map(loc => {
    const h = loc.hourly, keys = Object.keys(h).filter(k => k.startsWith("snowfall"));
    const n = h.time.length, prob = new Array(n).fill(null);
    for(let t=0;t<n;t++){
      let hit=0, cnt=0;
      for(const k of keys){
        const a=h[k]; let s=0, ok=false;
        for(let d=-1; d<=1; d++){ const v=a[t+d]; if(v!=null){ s+=v; ok=true; } }
        if(ok){ cnt++; if(s>=2) hit++; }
      }
      prob[t] = cnt ? hit/cnt : null;
    }
    return {time:h.time, prob};
  });
}
function valAt(loc, tSec){
  const h = loc.hourly, i = Math.round((tSec - h.time[0])/3600);
  if(i<0 || i>=h.time.length) return null;
  return {temp:h.temperature_2m[i], pr:h.precipitation[i], snow:h.snowfall[i], pp:h.precipitation_probability[i],
          code:h.weather_code[i], gust:h.wind_gusts_10m[i], vis:h.visibility ? h.visibility[i] : null};
}
function probAt(ens, tSec){
  if(!ens) return null;
  const i = Math.round((tSec - ens.time[0])/3600);
  return (i<0 || i>=ens.prob.length) ? null : ens.prob[i];
}
function assess(v, prob){
  if(!v) return {lvl:-1, why:["w.nofc"]};
  let lvl=0; const why=[];
  const up=(l,w)=>{ if(l>lvl) lvl=l; if(w && !why.includes(w)) why.push(w); };
  const empty = Number(S.empty)===1;
  if([56,57,66,67].includes(v.code)) up(3,"w.ice");
  if(v.snow>=3) up(3,"w.hsnow"); else if(v.snow>=1.5) up(2,"w.snowfall"); else if(v.snow>=0.3) up(1,"w.snow");
  if([75,86].includes(v.code)) up(2,"w.hsnow");
  const g = v.gust||0, g3 = empty?75:90, g2 = empty?60:70, g1 = empty?45:55;
  if(g>=g3) up(3,"w.stormwind"); else if(g>=g2) up(2,"w.sgust"); else if(g>=g1) up(1,"w.gust");
  if(v.vis!=null){ if(v.vis<400) up(2,"w.vis400"); else if(v.vis<1500) up(1,"w.lowvis"); }
  if(v.temp!=null && v.temp>-3 && v.temp<1.5 && (v.pr||0)>=0.2) up(1,"w.blackice");
  if(v.snow>=0.3 && g>=g1) up(Math.max(2,lvl),"w.blizzard");
  if([96,99].includes(v.code)) up(2,"w.hail"); else if(v.code>=95) up(1,"w.thunder");
  if(prob!=null){ if(prob>=0.6) up(2,"w.hiprob"); else if(prob>=0.3) up(1,"w.prob"); }
  return {lvl, why};
}

function pip(pt, ring){ // pt [lon,lat], ring [[lon,lat],...]
  let ins=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];

async function fetchNWS(pts){

  const res = await pool(us, 4, p => getJSON(`https://api.weather.gov/alerts/active?point=${p.lat},${p.lon}`, {headers:{"Accept":"application/geo+json"}}, 15000));

async function fetchECCC(pts, bbox){
  const url = `https://api.weather.gc.ca/collections/weather-alerts/items?f=json&lang=en&limit=500&bbox=${bbox.join(",")}`;
  const j = await getJSON(url, {}, 25000);
  const out = new Map();
  (j.features||[]).forEach(f => {
    const pr = f.properties || {};
    if(!pts.some(p => inGeom([p.lon,p.lat], f.geometry))) return;
    const pick = (...ks) => { for(const k of ks){ if(pr[k]) return pr[k]; } return ""; };
    const name = pick("alert_name_en","alert_short_name_en","headline","event","alert_type");
    const type = String(pick("alert_type","type")).toLowerCase();

    if(out.has(key)) return;
    out.set(key, {src:"Environment Canada", event:name, head:name, sev: /warning/i.test(type+name) ? "Severe" : "Moderate",
      area: pick("feature_name_en","area","zone_name_en"), from: pick("effective_datetime","publication_datetime","effective"),
      to: pick("expiration_datetime","validity_datetime","expires"), text: pick("alert_text_en","description","text")});

/* ============ низкие мосты (OSM) ============ */
function parseHeight(s){
  if(!s) return null; s = String(s).trim().toLowerCase();
  if(/^(none|default|below_default|no_sign|no_indications|unsigned|signed)$/.test(s)) return null;
  let m = s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft|feet|′)\s*(?:(\d+(?:\.\d+)?)\s*(?:"|in|inch|inches|″)?)?$/);
  if(m) return +m[1]*0.3048 + (m[2]? +m[2]*0.0254 : 0);
  m = s.match(/^(\d+(?:\.\d+)?)\s*m?$/);
  if(m){ const v=+m[1]; return v>=8 ? v*0.3048 : v; } // «13.5» без единиц в США — скорее футы
  return null;
}
async function fetchBridges(route){
  // прореживаем линию до точки примерно каждые 1.2 км
  const c = route.coords, line=[]; let last=null;
  for(const p of c){ if(!last || hav(last,p)>=1.2){ line.push(p); last=p; } }
  line.push(c[c.length-1]);
  const coordStr = line.map(p=>p[0].toFixed(5)+","+p[1].toFixed(5)).join(",");
  const q = `[out:json][timeout:150];(way["maxheight"](around:18,${coordStr});node["maxheight"](around:18,${coordStr});way["maxheight:physical"](around:18,${coordStr}););out center tags;`;
  const eps = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
  let j=null, err=null;
  for(const ep of eps){
    try{ j = await getJSON(ep, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"data="+encodeURIComponent(q)}, 160000); break; }
    catch(e){ err=e; }
  }
  if(!j) throw err || new Error(t("ovp"));
  const H = heightM(), out=[];
  for(const e of j.elements||[]){
    const t = e.tags||{}, raw = t["maxheight:physical"] || t.maxheight;
    const hm = parseHeight(raw); if(hm==null) continue;
    const lat = e.lat ?? (e.center && e.center.lat), lon = e.lon ?? (e.center && e.center.lon);
    if(lat==null) continue;
    const gap = hm - H;
    if(gap > 0.3) continue;
    out.push({lat, lon, hm, raw, gap, name: t.name || t.ref || null, kind: t.bridge ? "br.bridge" : t.tunnel ? "br.tunnel" : "br.limit", id:e.type+"/"+e.id});
  }
  // ближайшие дубли (одна и та же точка разными объектами)
  const ded=[]; for(const b of out.sort((a,b)=>a.gap-b.gap)){ if(!ded.some(d=>hav([d.lat,d.lon],[b.lat,b.lon])<0.15)) ded.push(b); }
  // сортируем по ходу маршрута
  ded.forEach(b => { let best=1e9, bi=0; route.coords.forEach((p,i)=>{ if(i%3) return; const d=hav(p,[b.lat,b.lon]); if(d<best){best=d;bi=i;} }); b.order=bi; });
  return ded.sort((a,b)=>a.order-b.order);
}

/* ============ расчётное время прибытия ============ */
const MPH = 1.609344;
function gusts(){ const e = Number(S.empty)===1; return {g2: e?60:70, g3: e?75:90}; }
function isStorm(v){
  if(!v) return false; const {g2,g3} = gusts();
  return [56,57,66,67].includes(v.code) || v.snow>=3 || (v.snow>=1.5 && (v.gust||0)>=g2) || (v.gust||0)>=g3;
}
function hIdx(loc, tSec){ return Math.round((tSec - loc.hourly.time[0])/3600); }
function stormEnd(loc, tSec){ // время (сек), когда шторм в точке закончится
  const h = loc.hourly, n = h.time.length; let i = Math.max(0, hIdx(loc, tSec));
  while(i<n && isStorm(valAt(loc, h.time[i]))) i++;
  return {end: i<n ? h.time[i] : h.time[n-1]+3600, open: i>=n};
}
function postStorm(loc, tSec){ // {cap км/ч, why} — расчистка и ограничение после сильного снега
  const clr = Number(S.clearH)||0, rh = Number(S.rh)||0; if(clr+rh<=0) return null;
  const h = loc.hourly, i1 = hIdx(loc, tSec), i0 = Math.max(0, i1 - Math.ceil(clr+rh) - 12);
  let acc=0, last=-1, ice=false;
  for(let i=i0; i<=i1 && i<h.time.length; i++){
    const s=h.snowfall[i]||0, isIce=[56,57,66,67].includes(h.weather_code[i]);
    acc+=s; if(isIce) ice=true; if(s>=0.3 || isIce) last=i;
  }
  if((acc<5 && !ice) || last<0) return null;
  const since = i1 - last; // часов после окончания осадков
  if(since>=1 && since<=clr) return {cap:30*MPH, why:"w.clear"};
  if(since>clr && since<=clr+rh) return {cap:(Number(S.rmph)||45)*MPH, why:"w.restr"};
  return null;
}
const ET = new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", hour:"numeric", hour12:false, weekday:"short"});
const ZONES = [ // пробки: центр, радиус км, коэффициент в час пик
  {lat:40.75, lon:-73.95, r:45, f:0.45, n:"New York / New Jersey"},
  {lat:41.10, lon:-73.40, r:35, f:0.6, n:"I-95 Connecticut"},
  {lat:42.36, lon:-71.06, r:30, f:0.55, n:"Boston"},
  {lat:41.82, lon:-71.41, r:15, f:0.7, n:"Providence"},
  {lat:41.76, lon:-72.67, r:15, f:0.7, n:"Hartford"},
  {lat:43.66, lon:-70.26, r:10, f:0.8, n:"Portland, ME"}

function trafficFactor(p, tSec){
  if(Number(S.traffic)!==1) return {f:1};
  const z = ZONES.find(z => hav([z.lat,z.lon],[p.lat,p.lon]) <= z.r); if(!z) return {f:1};
  const parts = ET.formatToParts(new Date(tSec*1000));
  const hr = +parts.find(x=>x.type==="hour").value % 24, wd = parts.find(x=>x.type==="weekday").value;
  const weekend = wd==="Sat" || wd==="Sun";
  if(!weekend && ((hr>=6 && hr<10) || (hr>=15 && hr<19))) return {f:z.f, n:z.n};
  if(hr>=10 && hr<15 && z.r>=30) return {f:Math.min(1, z.f+0.3), n:z.n};
  if(weekend && hr>=11 && hr<19 && z.r>=30) return {f:Math.min(1, z.f+0.35), n:z.n};

function simulate(dep){
  const {sp, fc, ens} = STATE, pts = sp.pts, n = pts.length;
  const vmax = (Number(S.vmax)||65)*MPH, workPerKm = (Number(S.work)||0)/60/Math.max(1, sp.totalKm);
  let t = dep/1000, drv=0, sinceBreak=0, normalH=0, prevRestr=null;
  const bd = {storm:0, wx:0, restr:0, traffic:0, work:0, hos:0}, events=[], rows=[];
  let maxL=-1, score=0, maxP=null;
  for(let i=0; i<n; i++){
    const p = pts[i];
    let v = valAt(fc[i], t), pr = ens ? probAt(ens[i], t) : null;
    if(i<n-1 && S.storm==="wait" && isStorm(v)){
      const se = stormEnd(fc[i], t), until = se.end + (Number(S.clearH)||0)*3600;
      const why = assess(v, null).why;
      events.push({at:i, pos:"before", type:"storm", from:t, end:se.end, until, open:se.open, why});
      bd.storm += (until - t)/3600; t = until;
      v = valAt(fc[i], t); pr = ens ? probAt(ens[i], t) : null;
    }
    const a = assess(v, pr);
    rows.push({p, t:t*1000, v, pr, a});
    if(a.lvl>maxL) maxL=a.lvl; if(a.lvl>0) score += a.lvl*a.lvl;
    if(pr!=null && (maxP==null || pr>maxP)) maxP=pr;
    if(i===n-1) break;
    // скорость на участке i → i+1
    const segKm = pts[i+1].km - p.km; if(segKm<=0) continue;
    const baseH = sp.durH*segKm/sp.totalKm, v0 = Math.min(segKm/baseH, vmax);

    const tf = trafficFactor(p, t), spd = cap*tf.f;

    bd.wx += segKm/wxCap - segKm/v0; bd.restr += segKm/rCap - segKm/wxCap; bd.traffic += segKm/spd - segKm/rCap; bd.work += workPerKm*segKm;
    if(ps && ps.why!==prevRestr) events.push({at:i, pos:"after", type:"restr", why:ps.why, from:t});
    prevRestr = ps ? ps.why : null;
    if(tf.f<1 && !events.some(e=>e.type==="traffic" && e.n===tf.n)) events.push({at:i, pos:"after", type:"traffic", n:tf.n, f:tf.f, from:t});
    if(Number(S.hos)===1){
      if(drv+segH>11){ events.push({at:i, pos:"after", type:"rest", from:t, h:10}); t+=10*3600; bd.hos+=10; drv=0; sinceBreak=0; }
      else if(sinceBreak+segH>8){ events.push({at:i, pos:"after", type:"break", from:t, h:0.5}); t+=1800; bd.hos+=0.5; sinceBreak=0; }
    }

    [t("bd.work"), bd.work], [t("bd.hos"), bd.hos]
  ].filter(x => x[1] >= 1/60);
  const total = (d.eta - d.dep)/3600000;
  $("eta").innerHTML = `<span class="small">${t("eta.h")}</span><span class="big">${fmtT(d.eta)}</span>`+
    `<span class="small">${t("eta.line",{tot:fmtDur(total), norm:fmtDur(d.normalH)})}${d.delayH>=1/60?t("eta.delay",{d:fmtDur(d.delayH)}):""}</span>`+
    (items.length ? "<ul>"+items.map(x=>`<li>${x[0]}: +${fmtDur(x[1])}</li>`).join("")+"</ul>" : "");
  $("tripMeta").textContent = t("meta",{thr:U.snowThr(), p: d.maxP==null?t("na"):Math.round(d.maxP*100)+"%", s:U.dist(STATE.sp.totalKm/STATE.sp.pts.length)});
  const evRow = e => `<tr class="ev"><td colspan="6">${esc(evText(e))}</td></tr>`;
  $("tripRows").innerHTML = d.rows.map((r, i) => {
    const v=r.v||{};
    return d.events.filter(e=>e.at===i && e.pos==="before").map(evRow).join("") +
      `<tr><td>${fmtT(r.t)}</td><td><span class="dot ${lvClass(r.a.lvl)}"></span>${U.mark(r.p.km)}${r.p.name?"<br><span class='small'>"+esc(r.p.name)+"</span>":""}${r.a.why.length&&r.a.lvl>0?"<br><span class='small'>"+esc(whyTxt(r.a.why))+"</span>":""}</td>`+
      `<td>${U.temp(v.temp)}</td><td>${U.snow(v.snow)}</td>`+
      `<td>${U.wind(v.gust)}</td><td>${r.pr==null?"—":Math.round(r.pr*100)+"%"}</td></tr>` +
      d.events.filter(e=>e.at===i && e.pos==="after").map(evRow).join("");
  }).join("");
  $("cardTrip").classList.remove("hidden");
  colorRoute(d);
  if(map){ d.events.filter(e=>e.type==="storm"||e.type==="rest").forEach(e => { const p=STATE.sp.pts[e.at];
    L.circleMarker([p.lat,p.lon], {radius:9, color:"#fff", weight:2, fillColor: e.type==="storm"?"#7c3aed":"#0284c7", fillOpacity:1}).bindPopup(esc(evText(e))).addTo(segLayer); }); }
}
function colorRoute(d){
  if(!map) return;
  segLayer.clearLayers();
  const c = STATE.route.coords, cols = ["#16a34a","#eab308","#f97316","#dc2626"];
  d.rows.forEach((r, i) => {
    const i0 = r.p.idx, i1 = i+1<d.rows.length ? d.rows[i+1].p.idx : c.length-1;
    if(i1<=i0) return;
    L.polyline(c.slice(i0, i1+1), {color: r.a.lvl<0 ? "#94a3b8" : cols[r.a.lvl], weight:6, opacity:.9})
      .bindPopup(`<b>${fmtT(r.t)}</b> · ${U.mark(r.p.km)}<br>${r.a.lvl<0?t("nodata"):lvName(r.a.lvl)}${r.a.why.length?": "+esc(whyTxt(r.a.why)):""}`)
      .addTo(segLayer);
  });
}
async function loadNames(){
  const R = STATE.cur; R.named = true;
  const pts = R.sp.pts, idx = pts.map((_,i)=>i).filter(i => i%3===0 || i===pts.length-1);
  const res = await pool(idx, 3, async i => { await sleep(150); return revName(pts[i].lat, pts[i].lon); });
  idx.forEach((i,k) => { const r=res[k]; if(r){ pts[i].name = [r.place, r.state].filter(Boolean).join(", "); pts[i].st = r.state; } });
  if(STATE.cur===R && STATE.sel!=null) selectDep(STATE.sel);
}
function renderRoadLinks(){
  const pts = STATE.sp.pts, used = [];
  JUR.forEach(j => { if(pts.some(p => p.lat>=j.b[0] && p.lat<=j.b[1] && p.lon>=j.b[2] && p.lon<=j.b[3])) if(!used.some(u=>u.u===j.u)) used.push(j); });
  $("roadLinks").innerHTML = used.map(j => `<a href="${j.u}" target="_blank" rel="noopener">${esc(j.n)}</a>`).join("");
  const {a,b} = STATE;
  $("navLinks").innerHTML = `<a href="https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lon}&destination=${b.lat},${b.lon}&travelmode=driving" target="_blank" rel="noopener">${t("gmaps")}</a>`+
    `<a href="https://maps.apple.com/?saddr=${a.lat},${a.lon}&daddr=${b.lat},${b.lon}&dirflg=d" target="_blank" rel="noopener">${t("amaps")}</a>`;
  $("cardRoads").classList.remove("hidden");
}
const WINTER = /winter|snow|blizzard|ice|freez|wind|storm|squall|avalanche|flood|fog|hiver|neige|verglas|pluie/i;
async function loadAlerts(){
  const R = STATE.cur;
  $("cardAlerts").classList.remove("hidden"); $("alerts").textContent = t("loading");
  const pts = STATE.sp.pts, lats = pts.map(p=>p.lat), lons = pts.map(p=>p.lon);
  const bbox = [Math.min(...lons)-0.2, Math.min(...lats)-0.2, Math.max(...lons)+0.2, Math.max(...lats)+0.2];
  const [us, ca] = await Promise.all([fetchNWS(pts).catch(()=>null), fetchECCC(pts, bbox).catch(()=>null)]);
  R.alerts = {us, ca};
  if(STATE.cur !== R) return;
  STATE.alerts = R.alerts; renderAlerts();
  const all = [...(ca||[]), ...(us||[])];
  if(all.some(a => /warning/i.test(a.event) && WINTER.test(a.event))) warn(t("w.alert"));
}
function renderAlerts(){
  if(!STATE || !STATE.alerts) return;
  const {us, ca} = STATE.alerts, all = [...(ca||[]), ...(us||[])];
  all.sort((x,y) => (WINTER.test(y.event)?1:0)-(WINTER.test(x.event)?1:0));
  let html = all.length ? all.map(a => {
    const sev = /severe|extreme/i.test(a.sev) || /warning/i.test(a.event);
    const when = [a.from, a.to].filter(Boolean).map(x => { const d=new Date(x); return isNaN(d)? x : fmtT(d.getTime()); }).join(" → ");
    return `<div class="alert ${sev?"sev":""}"><b>${esc(a.head)}</b><span class="small">${esc(a.src)} · ${esc(when)}${a.area?" · "+esc(String(a.area).slice(0,140)):""}</span>`+
      (a.text? `<details><summary>${t("more")}</summary><div class="small" style="white-space:pre-wrap">${esc(a.text)}</div></details>`:"")+`</div>`;
  }).join("") : t("noalerts");
  if(us==null) html += "<div class='small'>"+t("nws.na")+"</div>";
  if(ca==null) html += "<div class='small'>"+t("eccc.na")+"</div>";
  $("alerts").innerHTML = html;
}
async function loadBridges(){
  $("cardBridges").classList.remove("hidden");
  $("bridges").textContent = t("br.loading");
  try{
    const R = STATE.cur;
    R.bridges = await fetchBridges(R.route);
    if(STATE.cur === R){ STATE.bridges = R.bridges; renderBridges(); }
  }catch(e){
    $("bridges").textContent = t("br.fail",{e:e.message});
  }
}
function renderBridges(){
  if(!STATE || !STATE.bridges) return;
  const list = STATE.bridges, H = heightM(), nm = b => b.name || t(b.kind||"br.limit");
  if(map) bridgeLayer.clearLayers();
  const low = list.filter(b=>b.gap<0.08), near = list.filter(b=>b.gap>=0.08);
  const row = b => `<tr><td><span class="dot ${b.gap<0.08?"lv3":"lv1"}"></span>${esc(nm(b))}</td><td><b>${U.height(b.hm)}</b><br><span class="small">${U.height2(b.hm)}</span></td><td><a href="https://www.openstreetmap.org/${b.id}" target="_blank" rel="noopener">${t("br.map")}</a></td></tr>`;
  list.forEach(b => {
    if(!map) return;
    L.circleMarker([b.lat,b.lon], {radius:8, color:"#fff", weight:2, fillColor: b.gap<0.08?"#dc2626":"#eab308", fillOpacity:1})
      .bindPopup(`<b>${esc(nm(b))}</b><br>${t("br.h")}: ${U.height(b.hm)} (${U.height2(b.hm)})<br>${t("br.truck")}: ${U.height(H)}<br><span class="small">OSM: ${esc(b.raw)}</span>`).addTo(bridgeLayer);
  });
  let html = `<div>${t("br.yours")} <b>${U.height(H)}</b> (${U.height2(H)}). ${STATE.route.truck ? t("br.avoid") : ""}</div>`;
  if(!list.length) html += "<p>"+t("br.none")+"</p>";
  else html += `<p>${low.length?`<b style="color:var(--l3)">${t("br.low",{n:low.length})}</b>. `:""}${near.length?t("br.near",{m:U.margin(), n:near.length}):""} ${t("br.maybe")}</p>`+
    `<table><thead><tr><th>${t("br.obj")}</th><th>${t("br.h")}</th><th></th></tr></thead><tbody>${list.map(row).join("")}</tbody></table>`;
  $("bridges").innerHTML = html + "<p class='small'>"+t("br.note")+"</p>";
}

/* ============ интерфейс ============ */
function fillVehicle(v, units){
  const hM = (v.hft||0)*0.3048 + (v.hin||0)*0.0254;
  if(units==="metric"){
    $("sHm").value = hM.toFixed(2); $("sW").value = +(+v.w).toFixed(1); $("sL").value = +(+v.l).toFixed(1);
    $("sVmax").value = Math.round(v.vmax*1.609344); $("sRmph").value = Math.round(v.rmph*1.609344);
  } else {
    const tin = Math.round(hM/0.0254); $("sHft").value = Math.floor(tin/12); $("sHin").value = tin%12;
    $("sWlb").value = Math.round(v.w*2204.62/100)*100; $("sLft").value = Math.round(v.l*3.28084);
    $("sVmax").value = Math.round(v.vmax); $("sRmph").value = Math.round(v.rmph);
  }
  document.querySelectorAll(".uSpd").forEach(e => e.textContent = units==="metric" ? t("kmh") : "mph");
  $("optSlow").textContent = t("set.slow",{spd: units==="metric" ? "40 "+t("kmh") : "25 mph"});
}
function readVehicle(units){
  if(units==="metric"){
    const hM = +$("sHm").value || 4.11, tin = hM/0.0254;
    return {hft:Math.floor(tin/12), hin:+(tin%12).toFixed(1), w:+$("sW").value||36, l:+$("sL").value||22,
            vmax:(+$("sVmax").value||105)/1.609344, rmph:(+$("sRmph").value||70)/1.609344};
  }
  return {hft:+$("sHft").value||13, hin:+$("sHin").value||0, w:(+$("sWlb").value||80000)/2204.62, l:(+$("sLft").value||72)/3.28084,
          vmax:+$("sVmax").value||65, rmph:+$("sRmph").value||45};
}
let settingsUnits = "imperial";
function openSettings(){
  settingsUnits = S.units==="metric" ? "metric" : "imperial";
  $("sUnits").value = settingsUnits; $("sLang").value = S.lang || detectLang();
  document.body.classList.toggle("metric", settingsUnits==="metric");
  $("sKey").value=S.key||""; $("sTolls").value=S.tolls||"allow"; $("sSpeed").value=S.speed; $("sEmpty").value=S.empty;
  fillVehicle(S, settingsUnits);
  $("sStorm").value=S.storm; $("sClear").value=S.clearH; $("sRh").value=S.rh; $("sWork").value=S.work; $("sTraffic").value=S.traffic; $("sHos").value=S.hos;
  $("settings").style.display="block";
}
$("sUnits").onchange = () => { // пересчитываем уже введённые значения в новые единицы
  const v = readVehicle(settingsUnits); settingsUnits = $("sUnits").value;
  document.body.classList.toggle("metric", settingsUnits==="metric");
  fillVehicle(v, settingsUnits);
};
$("btnSettings").onclick = openSettings;
$("btnClose").onclick = () => { $("settings").style.display="none"; if(S.lang!==$("sLang").dataset.orig){} applyUnits(); };
$("sLang").onchange = () => { // язык меняем сразу, чтобы было видно
  const v = readVehicle(settingsUnits); S.lang = $("sLang").value; LS.set("settings", S); applyStatic(); fillVehicle(v, settingsUnits);
};
$("btnSave").onclick = () => {
  S = Object.assign({lang:$("sLang").value, units:settingsUnits, tolls:$("sTolls").value, key:$("sKey").value.trim(), speed:+$("sSpeed").value||1, empty:+$("sEmpty").value,
    storm:$("sStorm").value, clearH:Math.max(0,+$("sClear").value||0), rh:Math.max(0,+$("sRh").value||0),
    work:Math.max(0,+$("sWork").value||0), traffic:+$("sTraffic").value, hos:+$("sHos").value}, readVehicle(settingsUnits));
  LS.set("settings", S); $("settings").style.display="none";
  applyUnits();
  if(STATE) run();
};
/* ============ единицы: применить ко всему экрану ============ */
function applyUnits(){
  const imp = IMP();
  document.body.classList.toggle("metric", !imp);
  $("btnUnits").textContent = imp ? "mi" : "km";
  applyStatic();
  $("thT").textContent = imp ? "°F" : "°C";
  $("thS").textContent = t("th.snow")+", "+(imp ? "in" : t("cm"))+t("perh");
  $("thW").textContent = t("th.gust")+", "+(imp ? "mph" : t("kmh"));
  if(!$("from").value && !STATE) status(t("geo.hint"));
  if(STATE && STATE.deps){
    renderStatus();
    computeAll(); renderStrip(); selectDep(STATE.sel||0); renderBridges(); renderAlerts(); renderRoadLinks(); drawRoute(true);
  }
}
function renderStatus(){
  const sp = STATE.sp;
  status((STATE.routes.length>1 ? STATE.cur.letter+": " : "") + t("st.done",{d:U.dist(sp.totalKm), h:sp.durH.toFixed(1)}) + (STATE.route.truck ? t("st.truck") : "") + (STATE.ens ? "" : t("st.noens")) + (STATE.routes.length>1 ? t("st.nalts",{n:STATE.routes.length}) : ""));
}
function setLang(l){ S.lang = l; LS.set("settings", S); applyUnits(); }
$("btnLang").onclick = () => { const cur = S.lang || detectLang(), i = LANGS.findIndex(x=>x[0]===cur); setLang(LANGS[(i+1)%LANGS.length][0]); };
document.querySelectorAll("#unitsPick [data-l]").forEach(b => b.onclick = () => {
  setLang(b.dataset.l);
  document.querySelectorAll("#unitsPick [data-l]").forEach(x => x.classList.toggle("sec", x!==b));
});
function setUnits(u){ S.units = u; LS.set("settings", S); applyUnits(); }
$("btnUnits").onclick = () => setUnits(IMP() ? "metric" : "imperial");
document.querySelectorAll("#unitsPick [data-u]").forEach(b => b.onclick = () => { $("unitsPick").style.display="none"; setUnits(b.dataset.u); });
$("btnGo").onclick = run;
/* ============ местоположение ============ */
let meMarker = null, lastFix = null;
function showMe(lat, lon, acc){
  if(!map) return;
  if(meMarker) meMarker.remove();
  meMarker = L.layerGroup([
    L.circle([lat,lon], {radius:Math.min(acc||50, 2000), color:"#2563eb", weight:1, fillOpacity:.1}),
    L.circleMarker([lat,lon], {radius:8, color:"#fff", weight:3, fillColor:"#2563eb", fillOpacity:1})
  ]).addTo(map);
}
function locate(opts={}){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ status(t("geo.na")); return resolve(null); }
    if(!opts.silent) status(t("geo.busy"));
    navigator.geolocation.getCurrentPosition(async p => {
      const lat = +p.coords.latitude.toFixed(5), lon = +p.coords.longitude.toFixed(5);
      lastFix = {lat, lon};
      const el = $("from");
      el.value = t("geo.me"); el.dataset.lat = lat; el.dataset.lon = lon; el.dataset.geo = "1";
      showMe(lat, lon, p.coords.accuracy);
      if(map && !STATE) map.setView([lat, lon], 9);
      if(!opts.silent) status(t("geo.ok"));
      try{ const r = await revName(lat, lon); if(r && el.dataset.geo==="1"){ el.value = "📍 " + [r.place, r.state].filter(Boolean).join(", "); } }catch(e){}
      saveLast(); resolve(lastFix);
    }, e => {
      const msg = e.code===1 ? t("geo.denied") : t("geo.fail")+" "+e.message;
      if(!opts.silent) status(msg); resolve(null);
    }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
  });
}
$("btnGeo").onclick = () => locate();

/* ============ подсказки при вводе ============ */
function saveLast(){
  const f=$("from"), t=$("to");
  LS.set("last", {from:f.value, to:t.value, fLat:f.dataset.lat||null, fLon:f.dataset.lon||null, fGeo:f.dataset.geo||null, tLat:t.dataset.lat||null, tLon:t.dataset.lon||null});
}
function fmtPlace(pr){
  const main = pr.name || [pr.housenumber, pr.street].filter(Boolean).join(" ") || pr.city || "";
  const sub = [pr.street && pr.name ? pr.street : null, pr.city && pr.city!==main ? pr.city : null, pr.state, pr.countrycode ? pr.countrycode.toUpperCase() : null].filter(Boolean).join(", ");
  return {main, sub};
}
function setupAC(input, box, isFrom){
  let timer=null, ctl=null, items=[];
  const close = () => box.classList.remove("open");
  const render = (list, note) => {
    items = list;
    let html = "";
    if(isFrom) html += `<button type="button" class="me" data-me="1">${t("geo.me")}</button>`;
    html += list.map((it,i) => `<button type="button" data-i="${i}">${esc(it.main)}${it.sub?`<small>${esc(it.sub)}</small>`:""}</button>`).join("");
    if(note) html += `<div class="hint">${esc(note)}</div>`;
    box.innerHTML = html;
    box.classList.toggle("open", !!html);
  };
  const choose = it => {
    input.value = it.sub ? it.main + ", " + it.sub.replace(/, (US|CA)$/,"") : it.main;
    input.dataset.lat = it.lat; input.dataset.lon = it.lon; delete input.dataset.geo;
    close(); saveLast();
    if(isFrom) $("to").focus(); else input.blur();
  };
  box.addEventListener("pointerdown", e => e.preventDefault()); // не терять фокус при нажатии
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.me){ close(); input.blur(); locate(); return; }
    choose(items[+b.dataset.i]);
  });
  const search = async q => {
    const ql = q.toLowerCase();
    const local = PRESETS.filter(p => p[0].toLowerCase().includes(ql)).slice(0,3).map(p => ({main:p[0], sub:"", lat:p[1], lon:p[2]}));
    render(local, q.length>=2 ? t("ac.searching") : "");
    if(q.length < 2) return;
    if(ctl) ctl.abort(); ctl = new AbortController();
    const bias = lastFix || {lat:44.5, lon:-68.5};
    const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7&lang=en&lat=${bias.lat}&lon=${bias.lon}&bbox=-100,24,-50,62`;
    try{
      const r = await fetch(url, {signal:ctl.signal}); const j = await r.json();
      const seen = new Set(local.map(x=>x.main.toLowerCase()));
      const remote = (j.features||[]).map(f => Object.assign(fmtPlace(f.properties), {lat:f.geometry.coordinates[1], lon:f.geometry.coordinates[0]}))
        .filter(x => x.main && !seen.has((x.main+", "+x.sub).toLowerCase()) && (seen.add((x.main+", "+x.sub).toLowerCase()), true));
      const all = local.concat(remote);
      render(all, all.length ? "" : t("ac.none"));
    }catch(e){ if(e.name!=="AbortError") render(local, t("ac.offline")); }
  };
  input.addEventListener("input", () => {
    delete input.dataset.lat; delete input.dataset.lon; delete input.dataset.geo;
    clearTimeout(timer); const q = input.value.trim();
    timer = setTimeout(() => search(q), 250);
  });
  input.addEventListener("focus", () => {
    if(input.dataset.geo==="1" || /^📍/.test(input.value)) input.select();
    search(input.value.trim().replace(/^📍\s*/,"") && !input.dataset.lat ? input.value.trim() : "");
  });
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("keydown", e => {
    if(e.key==="Enter"){ e.preventDefault(); if(items[0] && !input.dataset.lat) choose(items[0]); else { close(); if(!isFrom) run(); else $("to").focus(); } }
  });
}
setupAC($("from"), $("acFrom"), true);
setupAC($("to"), $("acTo"), false);

const last = LS.get("last", null);
if(last){
  $("from").value = last.from||""; $("to").value = last.to||"";
  if(last.fLat){ $("from").dataset.lat = last.fLat; $("from").dataset.lon = last.fLon; if(last.fGeo) $("from").dataset.geo = "1"; }
  if(last.tLat){ $("to").dataset.lat = last.tLat; $("to").dataset.lon = last.tLon; }
}
initMap();
window.addEventListener("resize", () => { if(map) setTimeout(() => map.invalidateSize(), 200); });
applyUnits();
if(!S.units || !S.lang){
  $("unitsPick").style.display = "block";
  const cur = S.lang || detectLang();
  document.querySelectorAll("#unitsPick [data-l]").forEach(x => x.classList.toggle("sec", x.dataset.l!==cur));
}
// если доступ к геолокации уже разрешён — сразу берём текущее место (без лишних вопросов)
(async () => {
  try{
    const st = navigator.permissions ? await navigator.permissions.query({name:"geolocation"}) : null;
    const f = $("from");
    if(st && st.state==="granted" && (!f.value || f.dataset.geo==="1")) locate({silent:true});
    else if(!f.value) status(t("geo.hint"));
  }catch(e){}
})();
// автообновление каждые 30 минут, пока приложение открыто
setInterval(() => { if(STATE && document.visibilityState==="visible") run(); }, 30*60*1000);
</script>
